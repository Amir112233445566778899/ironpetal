<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linkloom</title>
<style>
:root{--accent:#8a6a2f;--bg:#fbf7f1;--ink:#1a1714;--muted:#6f675f;--line:rgba(26,23,20,.1);--font:system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;padding:20px}
h1{font-size:28px;font-weight:600;margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:18px;font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
button,.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font:inherit}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:6px 0 10px;font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px}
ul{list-style:none} li{padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff;display:flex;justify-content:space-between;gap:8px;align-items:center}
</style></head><body>
<div class="tag">IRONPETAL LAB</div>
<h1 data-i18n="title">Linkloom</h1>
<p class="sub" data-i18n="sub">Built inside Ironpetal</p>

<div class="card">
<input id="title" placeholder="Title">
<input id="url" placeholder="https://">
<button id="add">Add link</button>
</div>
<ul id="list"></ul>
<script>
const K='linkloom';
function load(){const a=JSON.parse(localStorage.getItem(K)||'[]');document.getElementById('list').innerHTML=a.map((x,i)=>'<li><a href="'+x.u.replace(/"/g,'')+'" target="_blank" rel="noopener">'+x.t.replace(/</g,'&lt;')+'</a><button data-i="'+i+'" style="background:#fff;color:#1a1714;border:1px solid rgba(26,23,20,.1)">×</button></li>').join('');
document.querySelectorAll('#list button').forEach(b=>b.onclick=()=>{const a=JSON.parse(localStorage.getItem(K)||'[]');a.splice(+b.dataset.i,1);localStorage.setItem(K,JSON.stringify(a));load();});}
document.getElementById('add').onclick=()=>{const t=document.getElementById('title').value.trim();const u=document.getElementById('url').value.trim();if(!t||!u)return;const a=JSON.parse(localStorage.getItem(K)||'[]');a.unshift({t,u});localStorage.setItem(K,JSON.stringify(a));document.getElementById('title').value='';document.getElementById('url').value='';load();};
load();
</script>

<script>
window.addEventListener('message',function(e){
  if(!e.data||e.data.type!=='ip-lang')return;
  var pack=e.data.pack||{};
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var k=el.getAttribute('data-i18n');
    if(pack[k])el.textContent=pack[k];
  });
  if(e.data.dir)document.documentElement.dir=e.data.dir;
  if(e.data.lang)document.documentElement.lang=e.data.lang;
});
</script>
</body></html>
