<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ironpetal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 4c4 6 10 8 10 14a10 10 0 1 1-20 0c0-6 6-8 10-14z' fill='%233f3a36'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1714;--muted:#6f675f;--line:rgba(26,23,20,.1);--paper:rgba(251,247,241,.93);--sidebar:78px;--font:"IBM Plex Sans",system-ui,sans-serif;--serif:"Cormorant Garamond",Georgia,serif;--shadow:0 18px 50px rgba(40,30,20,.09)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);overflow:hidden;background:#efe6db url("bg.png") center/cover no-repeat fixed;top:0!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
.hidden{display:none!important}
.goog-te-banner-frame,.goog-te-balloon-frame,#goog-gt-tt,.skiptranslate,.goog-te-gadget{display:none!important}
#ipGtBox{position:absolute;width:0;height:0;overflow:hidden;opacity:0}

#langGate{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(239,230,219,.95);backdrop-filter:blur(10px)}
#langGate.hidden{display:none}
.lang-box{width:min(560px,100%);background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:28px 22px 20px}
.lang-box h1{font-family:var(--serif);font-size:clamp(28px,4vw,40px);font-weight:500;margin-bottom:8px}
.lang-box p{color:var(--muted);font-size:14px;margin-bottom:14px}
.lang-search{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;outline:none}
.lang-list{max-height:300px;overflow:auto;display:grid;gap:4px}
.lang-item{text-align:start;padding:10px 12px;border-radius:10px;display:flex;justify-content:space-between}
.lang-item:hover{background:rgba(26,23,20,.05)}
.lang-item small{color:var(--muted)}

#app{display:none;height:100%}
#app.show{display:flex}
.sidebar{width:var(--sidebar);flex-shrink:0;height:100%;border-inline-end:1px solid var(--line);background:rgba(251,247,241,.9);backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;z-index:5;overflow-y:auto}
.brand{width:38px;height:38px;border-radius:12px;margin-bottom:4px;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
.side-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;position:relative;flex-shrink:0}
.side-btn:hover{background:rgba(26,23,20,.05)}
.side-btn.active{background:#fff;border:1px solid var(--line);box-shadow:0 8px 18px rgba(40,30,20,.06)}
.side-btn .tip{position:absolute;inset-inline-start:52px;top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;font-size:11px;padding:5px 8px;border-radius:7px;opacity:0;pointer-events:none;white-space:nowrap;z-index:40}
.side-btn:hover .tip{opacity:1}
.side-spacer{flex:1;min-height:8px}
.main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(251,247,241,.88);backdrop-filter:blur(14px);z-index:50}
.top-title{font-family:var(--serif);font-size:20px;font-weight:500}
.menu-wrap{position:relative;z-index:60}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.menu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;width:230px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;z-index:80}
.menu.open{display:block}
.menu button{width:100%;text-align:start;padding:10px 11px;border-radius:9px;font-size:13px}
.menu button:hover{background:rgba(26,23,20,.05)}
.stage{flex:1;position:relative;overflow:hidden}
.scroll-home{position:absolute;inset:0;overflow:auto;display:none;scroll-behavior:smooth}
.scroll-home.show{display:block}
.hero-band{padding:34px 24px 20px;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:center}
@media(max-width:900px){.hero-band{grid-template-columns:1fr;padding:24px 16px}}
.hero-band h1{font-family:var(--serif);font-size:clamp(34px,5vw,54px);font-weight:500;line-height:1.05;margin-bottom:12px}
.lead{color:var(--muted);line-height:1.6;max-width:48ch;margin-bottom:16px}
.hero-art{min-height:200px;border-radius:28px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(232,214,196,.5))}
.pad{padding:8px 24px 48px;max-width:1100px;margin:0 auto}
@media(max-width:900px){.pad{padding:8px 16px 40px}}
.section{margin:26px 0 12px;font-family:var(--serif);font-size:26px;font-weight:500}
.section span{display:block;font-family:var(--font);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card h3{font-family:var(--serif);font-size:22px;font-weight:500;margin-bottom:6px}
.desc{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:10px}
.creator{font-size:12px;line-height:1.45;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.75);border:1px solid var(--line);margin-bottom:12px}
.creator a{color:#0f766e;text-decoration:underline;font-weight:600}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:500}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:#fff;border:1px solid var(--line)}
.btn-accent{background:linear-gradient(120deg,#2f5d8c,#5b4b8a);color:#fff}
.feature{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:8px 0}
.feature .f{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px}
.feature h4{font-size:14px;margin-bottom:6px}
.feature p{font-size:12px;color:var(--muted);line-height:1.45}
.field{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;margin:6px 0 10px;outline:none}
textarea.field{min-height:90px;resize:vertical}
.comment{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.comment .meta{font-size:11px;color:var(--muted);margin-bottom:4px}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:#fff}

/* full module mode */
body.mod-full .sidebar,body.mod-full .topbar{display:none!important}
body.mod-full #app{display:block}
body.mod-full .main{height:100%}
body.mod-full .stage{height:100%}
body.mod-full .frame-wrap{inset:0}
body.mod-full .mod-chrome{display:none}
body.mod-full iframe{height:100%}
.frame-wrap{position:absolute;inset:0;display:none;flex-direction:column}
.frame-wrap.show{display:flex}
.mod-chrome{flex-shrink:0;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(251,247,241,.95);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
iframe{flex:1;width:100%;border:0;background:#fff}
.loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(251,247,241,.75);z-index:3;color:var(--muted)}
.loading.show{display:flex}

/* modals */
.modal{position:fixed;inset:0;z-index:1200;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(20,16,12,.45);backdrop-filter:blur(6px)}
.modal.show{display:flex}
.modal-card{width:min(440px,100%);background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
.modal-card h2{font-family:var(--serif);font-size:28px;font-weight:500;margin-bottom:8px}
.modal-card p{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:14px}

/* create account stage */
#accountView{position:absolute;inset:0;overflow:auto;display:none;padding:24px}
#accountView.show{display:block}
.acc-shell{max-width:520px;margin:24px auto;position:relative}
.acc-canvas{position:absolute;inset:-40px;pointer-events:none;overflow:hidden;border-radius:28px}
.acc-card{position:relative;background:rgba(251,247,241,.92);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow);overflow:hidden}
.acc-card::before{content:"";position:absolute;width:180px;height:180px;right:-40px;top:-40px;border-radius:50%;background:radial-gradient(circle,rgba(91,75,138,.2),transparent 70%);animation:orb 8s ease-in-out infinite}
.acc-card::after{content:"";position:absolute;width:140px;height:140px;left:-30px;bottom:-30px;border-radius:50%;background:radial-gradient(circle,rgba(47,93,140,.18),transparent 70%);animation:orb 10s ease-in-out infinite reverse}
@keyframes orb{0%,100%{transform:translate(0,0)}50%{transform:translate(12px,-16px)}}
.spark{position:absolute;width:4px;height:4px;border-radius:50%;background:#c4a484;opacity:.5;animation:spark 3s linear infinite}
@keyframes spark{0%{transform:translateY(40px);opacity:0}20%{opacity:.7}100%{transform:translateY(-120px);opacity:0}}
</style>
</head>
<body>
<div id="ipGtBox"><div id="google_translate_element"></div></div>

<div id="langGate">
  <div class="lang-box">
    <h1>Choose your language</h1>
    <p>Ironpetal and products will follow this language.</p>
    <input class="lang-search" id="langSearch" type="search" placeholder="Search…">
    <div class="lang-list" id="langList"></div>
  </div>
</div>

<div id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div class="top-title" id="topTitle">Ironpetal</div>
      <div class="menu-wrap">
        <button class="icon-btn" id="menuBtn" aria-label="menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="menu" id="settingsMenu">
          <button type="button" id="changeLangBtn">Language</button>
          <button type="button" id="goHomeBtn">Home</button>
          <button type="button" id="goAccountBtn">Account</button>
          <button type="button" id="reloadBtn">Reload</button>
        </div>
      </div>
    </header>
    <div class="stage">
      <div class="loading" id="loading">Loading…</div>
      <div class="scroll-home show" id="home"></div>
      <div id="accountView" class="notranslate"></div>
      <div class="frame-wrap" id="frameWrap">
        <div class="mod-chrome" id="modChrome"></div>
        <iframe id="frame" title="module" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads"></iframe>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="gateModal">
  <div class="modal-card">
    <h2>Enter product</h2>
    <p id="gateText">Use the public Ironpetal account, or continue with your own account inside the product.</p>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn btn-dark" id="gatePublic" type="button">Public Ironpetal account</button>
      <button class="btn btn-ghost" id="gatePersonal" type="button">Personal account</button>
      <button class="btn btn-ghost" id="gateCancel" type="button">Cancel</button>
    </div>
    <p id="gateHint" class="desc" style="margin-top:12px"></p>
  </div>
</div>

<script>
const RTL=new Set(["fa","ar","ur","he"]);
const LANGS=[
{code:"en",name:"English",region:"Global"},{code:"fa",name:"فارسی",region:"Iran"},
{code:"ja",name:"日本語",region:"Japan"},{code:"tr",name:"Türkçe",region:"Türkiye"},
{code:"de",name:"Deutsch",region:"Germany"},{code:"fr",name:"Français",region:"France"},
{code:"es",name:"Español",region:"Spain"},{code:"ar",name:"العربية",region:"Middle East"},
{code:"ru",name:"Русский",region:"Russia"},{code:"zh",name:"中文",region:"China"},
{code:"hi",name:"हिन्दी",region:"India"},{code:"ur",name:"اردو",region:"Pakistan"},
{code:"pt",name:"Português",region:"Brazil"},{code:"it",name:"Italiano",region:"Italy"},
{code:"ko",name:"한국어",region:"Korea"},{code:"id",name:"Bahasa Indonesia",region:"Indonesia"},
{code:"nl",name:"Nederlands",region:"Netherlands"},{code:"pl",name:"Polski",region:"Poland"},
{code:"sv",name:"Svenska",region:"Sweden"},{code:"uk",name:"Українська",region:"Ukraine"},
{code:"th",name:"ไทย",region:"Thailand"},{code:"vi",name:"Tiếng Việt",region:"Vietnam"}
];
const GT_MAP={zh:"zh-CN",he:"iw"};
function gtCode(l){l=(l||"en").toLowerCase();return GT_MAP[l]||l;}
const RUBIKA={lumera:"https://rubika.ir/lumera__studio",forge:"https://rubika.ir/Rustedwarfar_ForgeofRust",openvex:"https://rubika.ir/openvex"};
const PUBLIC_SITES=new Set(["lumera","host","store","forge","openvex"]); // products with public shared login
const MODULES=[
  {id:"lumera",title:"Lumera",src:"modules/lumera.html",group:"suite",desc:"Social canvas — posts, presence, explore.",maker:"Hesam",studio:"@lumera__studio",rubika:"lumera"},
  {id:"host",title:"Lumera Host",src:"modules/host.html",group:"suite",desc:"Publish pages from a clean host desk.",maker:"Hesam",studio:"@lumera__studio",rubika:"lumera"},
  {id:"store",title:"Lumera Store",src:"modules/store.html",group:"suite",desc:"Studio orders and service requests.",maker:"Hesam",studio:"@lumera__studio",rubika:"lumera"},
  {id:"luvex",title:"Luvex",src:"modules/luvex.html",group:"suite",desc:"Site verification and registry desk.",maker:"Hesam",studio:"@lumera__studio",rubika:"lumera"},
  {id:"forge",title:"Rusted Forge",src:"modules/forge.html",group:"suite",desc:"Mods platform with full forge tools.",maker:"Amirhossein",studio:"@Rustedwarfar_ForgeofRust",rubika:"forge"},
  {id:"openvex",title:"OpenVex",src:"modules/openvex.html",group:"suite",desc:"Secure login desk for OpenVex.",maker:"Mohammad Erfan",studio:"@openvex",rubika:"openvex"},
  {id:"northink",title:"Northink",src:"modules/northink.html",group:"lab",desc:"Fast local notes on this device.",maker:"Ironpetal Lab",studio:"@lumera__studio",rubika:"lumera"},
  {id:"pulseboard",title:"Pulseboard",src:"modules/pulseboard.html",group:"lab",desc:"Daily habits checklist.",maker:"Ironpetal Lab",studio:"@lumera__studio",rubika:"lumera"},
  {id:"gridcalc",title:"Gridcalc",src:"modules/gridcalc.html",group:"lab",desc:"Quick expression calculator.",maker:"Ironpetal Lab",studio:"@lumera__studio",rubika:"lumera"},
  {id:"linkloom",title:"Linkloom",src:"modules/linkloom.html",group:"lab",desc:"Save and open personal links.",maker:"Ironpetal Lab",studio:"@lumera__studio",rubika:"lumera"},
  {id:"quiettimer",title:"QuietTimer",src:"modules/quiettimer.html",group:"lab",desc:"25-minute focus timer.",maker:"Ironpetal Lab",studio:"@lumera__studio",rubika:"lumera"}
];

const state={lang:localStorage.getItem("ip_lang")||"",mod:"home",pending:null};

function loadUser(){try{var r=localStorage.getItem("ip_user");if(!r)return null;return JSON.parse(r);}catch(e){return null;}}
function saveUser(u){try{localStorage.setItem("ip_user",JSON.stringify(u));return true;}catch(e){console.error(e);return false;}}
function commentsKey(id){return "ip_comments_"+id;}
function loadComments(id){try{return JSON.parse(localStorage.getItem(commentsKey(id))||"[]");}catch(e){return [];}}
function saveComments(id,arr){localStorage.setItem(commentsKey(id),JSON.stringify(arr.slice(0,80)));}

function forceGoogleLang(lang){
  const c=gtCode(lang);
  try{document.cookie="googtrans=/auto/"+c+";path=/";document.cookie="googtrans=/auto/"+c+";path=/;domain="+location.hostname;}catch(e){}
  const sel=document.querySelector("select.goog-te-combo");
  if(!sel){setTimeout(function(){forceGoogleLang(lang);},200);return;}
  if(sel.value!==c){sel.value=c;sel.dispatchEvent(new Event("change"));}
  setTimeout(function(){const s2=document.querySelector("select.goog-te-combo");if(s2&&s2.value!==c){s2.value=c;s2.dispatchEvent(new Event("change"));}},500);
}
function googleTranslateElementInit(){
  new google.translate.TranslateElement({pageLanguage:"auto",includedLanguages:"en,fa,ja,tr,de,fr,es,ar,ru,zh-CN,hi,ur,pt,it,ko,id,nl,pl,sv,uk,th,vi,ms,bn,iw",autoDisplay:false,multilanguagePage:true},"google_translate_element");
  if(state.lang) setTimeout(function(){forceGoogleLang(state.lang);},400);
}
window.googleTranslateElementInit=googleTranslateElementInit;

function injectFrameTranslate(frame,lang){
  try{
    const c=gtCode(lang);
    try{frame.contentWindow.localStorage.setItem("ip_lang",lang);}catch(e){}
    frame.contentWindow.postMessage({type:"ip-lang",lang:lang,dir:RTL.has(lang)?"rtl":"ltr"},"*");
    if(typeof frame.contentWindow.ipForceTranslate==="function") frame.contentWindow.ipForceTranslate(lang);
    const doc=frame.contentDocument; if(!doc) return;
    try{doc.cookie="googtrans=/auto/"+c+";path=/";}catch(e){}
    if(!doc.getElementById("ip-gt-src")){
      const s=doc.createElement("script");s.id="ip-gt-src";
      s.src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";
      doc.head.appendChild(s);
    }
    function pulse(){try{const sel=doc.querySelector("select.goog-te-combo");if(sel){sel.value=c;sel.dispatchEvent(new Event("change"));}}catch(e){}}
    setTimeout(pulse,200);setTimeout(pulse,600);setTimeout(pulse,1400);setTimeout(pulse,2500);
  }catch(e){}
}

function creatorBlock(m){
  const link=RUBIKA[m.rubika]||RUBIKA.lumera;
  return `<div class="creator">Maker: <strong>${m.maker}</strong><br>Studio <a href="${link}" target="_blank" rel="noopener">${m.studio}</a></div>`;
}

function renderSidebar(){
  const icons={
    home:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-5v-5H10v5H5a1 1 0 0 1-1-1v-8.5z"/></svg>',
    account:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.5"/><path d="M5 19c1.5-3 4-4.5 7-4.5S17.5 16 19 19"/></svg>',
    lumera:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5b4b8a" stroke-width="1.6"><circle cx="12" cy="12" r="3"/></svg>',
    host:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2f5d8c" stroke-width="1.6"><rect x="4" y="4" width="16" height="6" rx="1.5"/><rect x="4" y="14" width="16" height="6" rx="1.5"/></svg>',
    store:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3d6b4f" stroke-width="1.6"><path d="M6 8h12l-1 11H7L6 8z"/></svg>',
    luvex:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="1.6"><path d="M12 3l7 4v6c0 4-3 7-7 8-4-1-7-4-7-8V7l7-4z"/></svg>',
    forge:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>',
    openvex:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="1.6"><path d="M4 12h16M12 4v16"/></svg>',
    northink:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5b4b8a" stroke-width="1.6"><path d="M6 4h12v16H6z"/></svg>',
    pulseboard:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="1.6"><path d="M4 12h4l2-6 4 12 2-6h4"/></svg>',
    gridcalc:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2f5d8c" stroke-width="1.6"><rect x="5" y="3" width="14" height="18" rx="2"/></svg>',
    linkloom:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a6a2f" stroke-width="1.6"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/></svg>',
    quiettimer:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3d6b4f" stroke-width="1.6"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/></svg>'
  };
  const sb=document.getElementById("sidebar");
  let h=`<div class="brand"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3c3 4 7 5.5 7 10a7 7 0 1 1-14 0c0-4.5 4-6 7-10z"/></svg></div>
  <button class="side-btn ${state.mod==="home"?"active":""}" data-mod="home">${icons.home}<span class="tip">Home</span></button>
  <button class="side-btn ${state.mod==="account"?"active":""}" data-mod="account">${icons.account}<span class="tip">Account</span></button>`;
  MODULES.forEach(m=>{h+=`<button class="side-btn ${state.mod===m.id?"active":""}" data-mod="${m.id}">${icons[m.id]||icons.home}<span class="tip">${m.title}</span></button>`;});
  h+=`<div class="side-spacer"></div>`;
  sb.innerHTML=h;
  sb.querySelectorAll(".side-btn").forEach(b=>b.onclick=()=>requestOpen(b.dataset.mod));
}

function commentsUI(id){
  const list=loadComments(id);
  const user=loadUser();
  return `<div style="margin-top:12px">
    <h4 style="margin-bottom:8px;font-size:14px">Public comments</h4>
    <div id="cList-${id}">${list.map(c=>`<div class="comment"><div class="meta">${c.by} · ${new Date(c.at).toLocaleString()}</div>${c.text.replace(/</g,"&lt;")}</div>`).join("")||`<p class="desc">No comments yet.</p>`}</div>
    <textarea class="field" id="cText-${id}" placeholder="${user?"Write a public comment…":"Create an Ironpetal account to comment"}" ${user?"":"disabled"}></textarea>
    <button class="btn btn-dark" type="button" data-cpost="${id}" ${user?"":"disabled"}>Post comment</button>
  </div>`;
}

function renderHome(){
  document.body.classList.remove("mod-full");
  const suite=MODULES.filter(m=>m.group==="suite");
  const lab=MODULES.filter(m=>m.group==="lab");
  const user=loadUser();
  const card=m=>`<article class="card"><h3>${m.title}</h3><p class="desc">${m.desc}</p>${creatorBlock(m)}
    <div class="btn-row"><button class="btn btn-dark" data-open="${m.id}">Open</button></div>
    ${commentsUI(m.id)}</article>`;
  document.getElementById("home").innerHTML=`
  <section class="hero-band">
    <div>
      <h1>Crafted with intention.</h1>
      <p class="lead">Your desk for the suite. Create an Ironpetal account when you want — then open products full-screen with a thin return bar.</p>
      <div class="btn-row">
        <button class="btn btn-accent" data-mod="account" id="createAccountHero">${user?"My account":"Create account"}</button>
        <button class="btn btn-dark" data-open="lumera">Open Lumera</button>
        <button class="btn btn-ghost" data-open="northink">Lab tools</button>
      </div>
      ${user?`<p class="desc" style="margin-top:12px">Signed in as <strong>${user.username}</strong></p>`:""}
    </div>
    <div class="hero-art"></div>
  </section>
  <div class="pad">
    <div class="feature">
      <div class="f"><h4>Full-screen products</h4><p>Each site opens edge-to-edge with a thin Ironpetal bar to come home.</p></div>
      <div class="f"><h4>Public or personal login</h4><p>For Lumera, Forge and OpenVex choose shared Ironpetal credentials or your own.</p></div>
      <div class="f"><h4>Account + bio</h4><p>Simple Ironpetal profile — avatar, name, bio — stored on this device.</p></div>
      <div class="f"><h4>Public comments</h4><p>Leave notes under each product card for everyone on this browser profile.</p></div>
    </div>
    <h2 class="section"><span>Suite</span>Products</h2>
    <div class="grid">${suite.map(card).join("")}</div>
    <h2 class="section"><span>Lab</span>Tools</h2>
    <div class="grid">${lab.map(card).join("")}</div>
  </div>`;
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>requestOpen(b.getAttribute("data-open")));
  document.querySelectorAll("[data-mod]").forEach(b=>b.onclick=()=>requestOpen(b.getAttribute("data-mod")));
  document.querySelectorAll("[data-cpost]").forEach(b=>b.onclick=()=>{
    const id=b.getAttribute("data-cpost");
    const u=loadUser(); if(!u) return;
    const ta=document.getElementById("cText-"+id); const text=(ta.value||"").trim(); if(!text) return;
    const arr=loadComments(id); arr.unshift({by:u.username,text,at:Date.now()}); saveComments(id,arr); renderHome(); forceGoogleLang(state.lang||"en");
  });
  forceGoogleLang(state.lang||"en");
}


function renderAccount(){
  document.body.classList.remove("mod-full");
  document.getElementById("home").classList.remove("show");
  document.getElementById("frameWrap").classList.remove("show");
  const view=document.getElementById("accountView"); view.classList.add("show");
  const u=loadUser();
  const sparks=Array.from({length:14},(_,i)=>`<span class="spark" style="left:${8+i*7}%;bottom:${10+(i%5)*8}px;animation-delay:${i*0.2}s"></span>`).join("");
  if(!u){
    view.innerHTML=`<div class="acc-shell notranslate"><div class="acc-canvas">${sparks}</div><div class="acc-card">
      <h2 style="font-family:var(--serif);font-size:32px;font-weight:500;margin-bottom:8px">Create account</h2>
      <p class="desc">A simple Ironpetal identity for comments and public product login.</p>
      <form id="regForm" autocomplete="on">
      <label class="desc">Username</label><input class="field" id="regUser" name="username" maxlength="24" placeholder="choose a name" required>
      <label class="desc">Password</label><input class="field" id="regPass" name="password" type="password" placeholder="min 4 characters" required>
      <label class="desc">Display name</label><input class="field" id="regName" name="display" maxlength="40" placeholder="optional">
      <div class="btn-row"><button class="btn btn-accent" id="regGo" type="submit">Create account</button>
      <button class="btn btn-ghost" id="regBack" type="button">Back home</button></div>
      </form>
      <p class="desc" id="regErr" style="color:#a33;margin-top:8px"></p>
    </div></div>`;
    const form=document.getElementById("regForm");
    document.getElementById("regBack").onclick=function(){requestOpen("home");};
    form.addEventListener("submit", function(e){
      e.preventDefault();
      e.stopPropagation();
      const err=document.getElementById("regErr");
      try{
        const username=(document.getElementById("regUser").value||"").trim().toLowerCase();
        const password=document.getElementById("regPass").value||"";
        const display=(document.getElementById("regName").value||"").trim()||username;
        if(username.length<3){err.textContent="Username at least 3 characters.";return;}
        if(!/^[a-z0-9_\.]+$/i.test(username)){err.textContent="Only letters, numbers, _ and .";return;}
        if(password.length<4){err.textContent="Password at least 4 characters.";return;}
        let h=0; for(let i=0;i<password.length;i++) h=((h<<5)-h)+password.charCodeAt(i)|0;
        const userObj={username:username,display:display,pass:String(h),bio:"",avatar:"",at:Date.now()};
        localStorage.setItem("ip_user", JSON.stringify(userObj));
        err.style.color="#0f766e";
        err.textContent="Account created.";
        setTimeout(function(){renderAccount();},200);
      }catch(ex){
        err.style.color="#a33";
        err.textContent="Could not save account: "+(ex&&ex.message?ex.message:"error");
      }
    });
  } else {
    view.innerHTML=`<div class="acc-shell notranslate"><div class="acc-canvas">${sparks}</div><div class="acc-card">
      <h2 style="font-family:var(--serif);font-size:32px;font-weight:500;margin-bottom:8px">Your account</h2>
      <div class="btn-row" style="margin-bottom:12px;align-items:center">
        <img class="avatar" id="avPrev" src="${u.avatar||'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect fill=%22%23e8dccf%22 width=%2264%22 height=%2264%22/%3E%3Ccircle cx=%2232%22 cy=%2226%22 r=%2212%22 fill=%22%23a89080%22/%3E%3Cpath d=%22M12 56c4-12 12-16 20-16s16 4 20 16%22 fill=%22%23a89080%22/%3E%3C/svg%3E'}" alt="">
        <label class="btn btn-ghost">Upload profile<input type="file" id="avFile" accept="image/*" hidden></label>
      </div>
      <label class="desc">Display name</label><input class="field" id="pName" value="${String(u.display||"").replace(/"/g,"&quot;")}">
      <label class="desc">Bio</label><textarea class="field" id="pBio" maxlength="280">${String(u.bio||"").replace(/</g,"&lt;")}</textarea>
      <p class="desc">Username: <strong>${u.username}</strong></p>
      <div class="btn-row">
        <button class="btn btn-dark" id="pSave" type="button">Save profile</button>
        <button class="btn btn-ghost" id="pOut" type="button">Sign out</button>
        <button class="btn btn-ghost" id="pHome" type="button">Home</button>
      </div>
      <p class="desc" id="pMsg" style="margin-top:8px"></p>
    </div></div>`;
    const av=document.getElementById("avFile");
    if(av) av.onchange=function(ev){
      const f=ev.target.files&&ev.target.files[0]; if(!f) return;
      const r=new FileReader(); r.onload=function(){const cur=loadUser()||u; cur.avatar=r.result; saveUser(cur); document.getElementById("avPrev").src=r.result;}; r.readAsDataURL(f);
    };
    document.getElementById("pSave").onclick=function(){
      const cur=loadUser()||u;
      cur.display=(document.getElementById("pName").value||"").trim()||cur.username;
      cur.bio=(document.getElementById("pBio").value||"").trim();
      saveUser(cur); document.getElementById("pMsg").textContent="Saved.";
    };
    document.getElementById("pOut").onclick=function(){localStorage.removeItem("ip_user");renderAccount();};
    document.getElementById("pHome").onclick=function(){requestOpen("home");};
  }
  // do not force translate on account form (notranslate)
}

function openModule(id, mode){
  // mode: 'public' | 'personal' | null
  const m=MODULES.find(x=>x.id===id); if(!m) return;
  state.mod=id;
  document.getElementById("accountView").classList.remove("show");
  document.getElementById("home").classList.remove("show");
  document.getElementById("frameWrap").classList.add("show");
  document.body.classList.add("mod-full");
  document.getElementById("topTitle").textContent=m.title;
  renderSidebar();
  if(mode==="public"){
    try{localStorage.setItem("ip_public_login",JSON.stringify({user:"ironpetal",pass:"ironpetal",site:id}));}catch(e){}
  } else {
    try{localStorage.removeItem("ip_public_login");}catch(e){}
  }
  const loading=document.getElementById("loading"); const frame=document.getElementById("frame");
  loading.classList.add("show");
  frame.onload=function(){
    loading.classList.remove("show");
    injectFrameTranslate(frame, state.lang||"en");
    forceGoogleLang(state.lang||"en");
  };
  frame.src=m.src+"?embed=1&v="+Date.now()+"&lang="+(state.lang||"en")+(mode==="public"?"&pub=1":"");
}

function requestOpen(id){
  if(id==="home"){
    state.mod="home"; document.body.classList.remove("mod-full");
    document.getElementById("accountView").classList.remove("show");
    document.getElementById("frameWrap").classList.remove("show");
    document.getElementById("home").classList.add("show");
    document.getElementById("topTitle").textContent="Ironpetal";
    renderSidebar(); renderHome(); return;
  }
  if(id==="account"){
    state.mod="account"; document.body.classList.remove("mod-full");
    document.getElementById("frameWrap").classList.remove("show");
    document.getElementById("home").classList.remove("show");
    document.getElementById("topTitle").textContent="Account";
    renderSidebar(); renderAccount(); return;
  }
  if(PUBLIC_SITES.has(id)){
    state.pending=id;
    const user=loadUser();
    document.getElementById("gateText").textContent="Do you want to use the public Ironpetal account, or open with a personal account inside the product?";
    document.getElementById("gateHint").textContent=user?("Signed in on Ironpetal as "+user.username+". Public login uses username ironpetal / password ironpetal inside the product."):"Public account requires an Ironpetal account first — use Create account on the home page.";
    document.getElementById("gatePublic").disabled=!user;
    document.getElementById("gateModal").classList.add("show");
    return;
  }
  openModule(id,"personal");
}

document.getElementById("gatePublic").onclick=()=>{const id=state.pending;document.getElementById("gateModal").classList.remove("show");if(id) openModule(id,"public");};
document.getElementById("gatePersonal").onclick=()=>{const id=state.pending;document.getElementById("gateModal").classList.remove("show");if(id) openModule(id,"personal");};
document.getElementById("gateCancel").onclick=()=>{state.pending=null;document.getElementById("gateModal").classList.remove("show");};

function setLang(code){
  state.lang=code; try{localStorage.setItem("ip_lang",code);}catch(e){}
  document.documentElement.lang=code; document.documentElement.dir=RTL.has(code)?"rtl":"ltr";
  document.getElementById("langGate").classList.add("hidden"); document.getElementById("app").classList.add("show");
  forceGoogleLang(code); renderSidebar();
  if(state.mod==="home") renderHome();
  else if(state.mod==="account") renderAccount();
  else openModule(state.mod, null);
}
function renderLangList(filter){
  const q=(filter||"").trim().toLowerCase();
  const list=document.getElementById("langList"); list.innerHTML="";
  LANGS.filter(l=>!q||l.name.toLowerCase().includes(q)||l.region.toLowerCase().includes(q)||l.code.includes(q)).forEach(l=>{
    const b=document.createElement("button"); b.type="button"; b.className="lang-item";
    b.innerHTML=`<span>${l.name}</span><small>${l.region}</small>`; b.onclick=()=>setLang(l.code); list.appendChild(b);
  });
}
document.getElementById("langSearch").oninput=e=>renderLangList(e.target.value);
document.getElementById("menuBtn").onclick=e=>{e.stopPropagation();document.getElementById("settingsMenu").classList.toggle("open");};
document.addEventListener("click",e=>{if(!e.target.closest(".menu-wrap"))document.getElementById("settingsMenu").classList.remove("open");});
document.getElementById("changeLangBtn").onclick=()=>{document.getElementById("settingsMenu").classList.remove("open");document.getElementById("app").classList.remove("show");document.getElementById("langGate").classList.remove("hidden");renderLangList();};
document.getElementById("goHomeBtn").onclick=()=>{document.getElementById("settingsMenu").classList.remove("open");requestOpen("home");};
document.getElementById("goAccountBtn").onclick=()=>{document.getElementById("settingsMenu").classList.remove("open");requestOpen("account");};
document.getElementById("reloadBtn").onclick=()=>{document.getElementById("settingsMenu").classList.remove("open");if(state.mod==="home")renderHome();else if(state.mod==="account")renderAccount();else openModule(state.mod,null);};

window.addEventListener("message",function(e){
  if(!e.data) return;
  if(e.data.type==="ip-home") requestOpen("home");
  if(e.data.type==="ip-lang-open"){document.getElementById("app").classList.remove("show");document.getElementById("langGate").classList.remove("hidden");renderLangList();}
});

(function(){const s=document.createElement("script");s.src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";document.head.appendChild(s);})();
renderLangList();
if(state.lang) setLang(state.lang);
</script>
</body>
