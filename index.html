<style>
:root{
  --ink:#1a1714;--muted:#6f675f;--line:rgba(26,23,20,.1);
  --paper:rgba(251,247,241,.92);--sidebar:78px;
  --font:"IBM Plex Sans",system-ui,sans-serif;--serif:"Cormorant Garamond",Georgia,serif;
  --shadow:0 16px 40px rgba(40,30,20,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);overflow:hidden;background:#efe6db url("bg.png") center/cover no-repeat fixed}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}
.hidden{display:none!important}

#langGate{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(239,230,219,.94);backdrop-filter:blur(8px)}
#langGate.hidden{display:none}
.lang-box{width:min(540px,100%);background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:26px 20px 18px}
.lang-box h1{font-family:var(--serif);font-size:clamp(28px,4vw,40px);font-weight:500;margin-bottom:8px}
.lang-box p{color:var(--muted);font-size:14px;margin-bottom:14px}
.lang-search{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;outline:none}
.lang-list{max-height:300px;overflow:auto;display:grid;gap:4px}
.lang-item{text-align:start;padding:10px 12px;border-radius:10px;display:flex;justify-content:space-between;gap:8px}
.lang-item:hover{background:rgba(26,23,20,.05)}
.lang-item small{color:var(--muted)}

#app{display:none;height:100%;position:relative;z-index:1}
#app.show{display:flex}
.sidebar{width:var(--sidebar);flex-shrink:0;height:100%;border-inline-end:1px solid var(--line);background:rgba(251,247,241,.88);backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;z-index:5;overflow-y:auto}
.brand{width:38px;height:38px;border-radius:12px;margin-bottom:4px;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
.side-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;position:relative;flex-shrink:0}
.side-btn:hover{background:rgba(26,23,20,.05)}
.side-btn.active{background:#fff;border:1px solid var(--line);box-shadow:0 8px 18px rgba(40,30,20,.06)}
.side-btn .tip{position:absolute;inset-inline-start:52px;top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;font-size:11px;padding:5px 8px;border-radius:7px;opacity:0;pointer-events:none;white-space:nowrap;z-index:40}
.side-btn:hover .tip{opacity:1}
.side-spacer{flex:1;min-height:8px}

.main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);background:rgba(251,247,241,.85);backdrop-filter:blur(12px);position:relative;z-index:50}
.top-title{font-family:var(--serif);font-size:20px;font-weight:500}
.menu-wrap{position:relative;z-index:60}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.menu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;width:220px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;z-index:80}
.menu.open{display:block}
.menu button{width:100%;text-align:start;padding:10px 11px;border-radius:9px;font-size:13px}
.menu button:hover{background:rgba(26,23,20,.05)}

.stage{flex:1;position:relative;overflow:hidden}
.scroll-home{position:absolute;inset:0;overflow:auto;padding:22px 20px 40px;display:none}
.scroll-home.show{display:block}
.scroll-home h1{font-family:var(--serif);font-size:clamp(30px,4.5vw,46px);font-weight:500;margin-bottom:8px}
.lead{color:var(--muted);max-width:52ch;line-height:1.55;margin-bottom:18px}
.section{margin:22px 0 10px;font-family:var(--serif);font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;transition:.18s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card h3{font-family:var(--serif);font-size:20px;margin-bottom:4px}
.card .desc{font-size:13px;color:var(--muted);line-height:1.45;margin-bottom:10px}
.creator{font-size:12px;line-height:1.45;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.7);border:1px solid var(--line);margin-bottom:10px}
.creator a{color:#0f766e;text-decoration:underline;font-weight:600}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:500}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:#fff;border:1px solid var(--line)}
.feature{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:12px 0 20px}
.feature .f{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px}
.feature h4{font-size:14px;margin-bottom:4px}
.feature p{font-size:12px;color:var(--muted);line-height:1.4}

.frame-wrap{position:absolute;inset:0;display:none;flex-direction:column}
.frame-wrap.show{display:flex}
.mod-chrome{flex-shrink:0;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(251,247,241,.95);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.mod-chrome .meta{font-size:12px;color:var(--muted);line-height:1.4}
.mod-chrome .meta a{color:#0f766e;font-weight:600}
.mod-chrome strong{color:var(--ink);font-size:14px}
iframe{flex:1;width:100%;border:0;background:#fff}
.loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(251,247,241,.75);z-index:3;color:var(--muted)}
.loading.show{display:flex}
</style>
</head>

        <div class="menu" id="settingsMenu">

    </div>

</div>

    host:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2f5d8c" stroke-width="1.6"><rect x="4" y="4" width="16" height="6" rx="1.5"/><rect x="4" y="14" width="16" height="6" rx="1.5"/></svg>',
    store:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3d6b4f" stroke-width="1.6"><path d="M6 8h12l-1 11H7L6 8z"/></svg>',
    luvex:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="1.6"><path d="M12 3l7 4v6c0 4-3 7-7 8-4-1-7-4-7-8V7l7-4z"/></svg>',
    forge:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>',
    openvex:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="1.6"><path d="M4 12h16M12 4v16"/></svg>',
    northink:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5b4b8a" stroke-width="1.6"><path d="M6 4h12v16H6z"/></svg>',
    pulseboard:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="1.6"><path d="M4 12h4l2-6 4 12 2-6h4"/></svg>',
    gridcalc:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2f5d8c" stroke-width="1.6"><rect x="5" y="3" width="14" height="18" rx="2"/></svg>',
    linkloom:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a6a2f" stroke-width="1.6"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></svg>',
    quiettimer:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3d6b4f" stroke-width="1.6"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>'
  };
  let h=`<div class="brand"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3c3 4 7 5.5 7 10a7 7 0 1 1-14 0c0-4.5 4-6 7-10z"/></svg></div>
  <button class="side-btn ${state.mod==="home"?"active":""}" data-mod="home">${icons.home}<span class="tip">${t("home")}</span></button>`;
  MODULES.forEach(m=>{
    h+=`<button class="side-btn ${state.mod===m.id?"active":""}" data-mod="${m.id}">${icons[m.id]||icons.home}<span class="tip">${m.title}</span></button>`;
  });
  h+=`<div class="side-spacer"></div>`;
  sb.innerHTML=h;
  sb.querySelectorAll(".side-btn").forEach(b=>b.onclick=()=>openMod(b.dataset.mod));
}

function renderHome(){
  const suite=MODULES.filter(m=>m.group==="suite");
  const lab=MODULES.filter(m=>m.group==="lab");
  const card=m=>`<article class="card"><h3>${m.title}</h3><p class="desc">${t(m.desc)}</p>${creatorBlock(m)}<div class="btn-row"><button class="btn btn-dark" data-open="${m.id}">${t("open")}</button></div></article>`;
  document.getElementById("home").innerHTML=`
    <h1>${t("hero")}</h1>
    <p class="lead">${t("lead")}</p>
    <div class="feature">
      <div class="f"><h4>${t("f1t")}</h4><p>${t("f1d")}</p></div>
      <div class="f"><h4>${t("f2t")}</h4><p>${t("f2d")}</p></div>
      <div class="f"><h4>${t("f3t")}</h4><p>${t("f3d")}</p></div>
      <div class="f"><h4>${t("f4t")}</h4><p>${t("f4d")}</p></div>
    </div>
    <h2 class="section">${t("secSuite")}</h2>
    <div class="grid">${suite.map(card).join("")}</div>
    <h2 class="section">${t("secLab")}</h2>
    <div class="grid">${lab.map(card).join("")}</div>
    <h2 class="section">${t("secMore")}</h2>
    <div class="feature">
      <div class="f"><h4>Northink</h4><p>${t("d_northink")}</p></div>
      <div class="f"><h4>Pulseboard</h4><p>${t("d_pulse")}</p></div>
      <div class="f"><h4>QuietTimer</h4><p>${t("d_timer")}</p></div>
    </div>`;
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openMod(b.getAttribute("data-open")));
}

function pushLangToFrame(){
  const frame=document.getElementById("frame");
  try{
    const pack={title:document.getElementById("topTitle").textContent,sub:t("lead"),hint:t("d_northink")};
    frame.contentWindow.postMessage({type:"ip-lang",lang:state.lang,dir:RTL.has(state.lang)?"rtl":"ltr",pack},"*");
    // best-effort text direction on same-origin docs
    const doc=frame.contentDocument;
    if(doc&&doc.documentElement){
      doc.documentElement.lang=state.lang;
      doc.documentElement.dir=RTL.has(state.lang)?"rtl":"ltr";
    }
  }catch(e){}
}

function openMod(id){
  state.mod=id;
  renderSidebar();
  const home=document.getElementById("home");
  const wrap=document.getElementById("frameWrap");
  const loading=document.getElementById("loading");
  const frame=document.getElementById("frame");
  if(id==="home"){
    wrap.classList.remove("show");home.classList.add("show");
    document.getElementById("topTitle").textContent="Ironpetal";
    loading.classList.remove("show");
    renderHome();return;
  }
  const m=MODULES.find(x=>x.id===id);if(!m)return;
  home.classList.remove("show");wrap.classList.add("show");
  document.getElementById("topTitle").textContent=m.title;
  const link=RUBIKA[m.rubika]||RUBIKA.lumera;
  document.getElementById("modChrome").innerHTML=`<div><strong>${m.title}</strong><div class="meta">${t("maker")}: ${t(m.maker)} · ${t("studio")} <a href="${link}" target="_blank" rel="noopener">${t(m.studio)}</a></div></div>
  <div class="btn-row"><a class="btn btn-ghost" href="${link}" target="_blank" rel="noopener">${t("channel")}</a><button class="btn btn-ghost" id="backHome">${t("home")}</button></div>`;
  document.getElementById("backHome").onclick=()=>openMod("home");
  loading.classList.add("show");loading.textContent=t("loading");
  frame.onload=()=>{loading.classList.remove("show");pushLangToFrame();};
  frame.src=m.src+"?v="+Date.now();
}

function setLang(code){
  state.lang=code;localStorage.setItem("ip_lang",code);
  document.documentElement.lang=code;
  document.documentElement.dir=RTL.has(code)?"rtl":"ltr";
  document.getElementById("langGate").classList.add("hidden");
  document.getElementById("app").classList.add("show");
  document.getElementById("changeLangBtn").textContent=t("language");
  document.getElementById("goHomeBtn").textContent=t("home");
  document.getElementById("reloadBtn").textContent=t("reload");
  document.getElementById("lgTitle").textContent=t("chooseLang");
  document.getElementById("lgSub").textContent=t("langSub");
  renderSidebar();
  if(state.mod==="home")renderHome();else openMod(state.mod);
}

function renderLangList(filter){
  const q=(filter||"").trim().toLowerCase();
  const list=document.getElementById("langList");list.innerHTML="";
  document.getElementById("lgTitle").textContent=(I18N[state.lang]||I18N.en).chooseLang;
  document.getElementById("lgSub").textContent=(I18N[state.lang]||I18N.en).langSub;
  LANGS.filter(l=>!q||l.name.toLowerCase().includes(q)||l.region.toLowerCase().includes(q)||l.code.includes(q)).forEach(l=>{
    const b=document.createElement("button");b.type="button";b.className="lang-item";
    b.innerHTML=`<span>${l.name}</span><small>${l.region}</small>`;
    b.onclick=()=>setLang(l.code);list.appendChild(b);
  });
}

document.getElementById("langSearch").oninput=e=>renderLangList(e.target.value);
document.getElementById("menuBtn").onclick=e=>{e.stopPropagation();document.getElementById("settingsMenu").classList.toggle("open");};
document.addEventListener("click",e=>{if(!e.target.closest(".menu-wrap"))document.getElementById("settingsMenu").classList.remove("open");});
document.getElementById("changeLangBtn").onclick=()=>{document.getElementById("settingsMenu").classList.remove("open");document.getElementById("app").classList.remove("show");document.getElementById("langGate").classList.remove("hidden");renderLangList();};
document.getElementById("goHomeBtn").onclick=()=>{document.getElementById("settingsMenu").classList.remove("open");openMod("home");};
document.getElementById("reloadBtn").onclick=()=>{document.getElementById("settingsMenu").classList.remove("open");openMod(state.mod);};

renderLangList();
if(state.lang)setLang(state.lang);
</script>
</body>
</html>
