<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ironpetal</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1714;--muted:#6f675f;--line:rgba(26,23,20,.12);--paper:rgba(251,247,241,.94);--sidebar:78px;--font:"IBM Plex Sans",system-ui,sans-serif;--serif:"Cormorant Garamond",Georgia,serif;--shadow:0 18px 50px rgba(40,30,20,.1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);overflow:hidden;background:#efe6db url("bg.png") center/cover no-repeat fixed}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit}
.hidden{display:none!important}
.goog-te-banner-frame,.skiptranslate,.goog-te-gadget,#goog-gt-tt{display:none!important}
body{top:0!important}
#gt{position:absolute;width:0;height:0;overflow:hidden;opacity:0}

#langGate{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(239,230,219,.96)}
#langGate.hide{display:none}
.box{width:min(520px,100%);background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow)}
.box h1{font-family:var(--serif);font-size:34px;font-weight:500;margin-bottom:8px}
.box p{color:var(--muted);margin-bottom:12px;font-size:14px;line-height:1.5}
.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff}
.lang-list{max-height:280px;overflow:auto;display:grid;gap:4px}
.lang-item{text-align:left;padding:10px 12px;border-radius:10px;display:flex;justify-content:space-between}
.lang-item:hover{background:rgba(0,0,0,.05)}
.lang-item small{color:var(--muted)}

#app{display:none;height:100%}
#app.show{display:flex}
.sidebar{width:var(--sidebar);border-right:1px solid var(--line);background:rgba(251,247,241,.9);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;overflow-y:auto}
.side-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;position:relative}
.side-btn:hover,.side-btn.on{background:#fff;border:1px solid var(--line)}
.side-btn .tip{position:absolute;left:52px;top:50%;transform:translateY(-50%);background:#1a1714;color:#fff;font-size:11px;padding:5px 8px;border-radius:7px;opacity:0;pointer-events:none;white-space:nowrap;z-index:20}
.side-btn:hover .tip{opacity:1}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);background:rgba(251,247,241,.9)}
.title{font-family:var(--serif);font-size:20px}
.icon{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.menu-wrap{position:relative}
.menu{display:none;position:absolute;right:0;top:42px;width:210px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:var(--shadow);z-index:50}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:10px;border-radius:8px;font-size:13px}
.menu button:hover{background:rgba(0,0,0,.05)}
.stage{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto;display:none;padding:20px}
.view.on{display:block}
.hero{max-width:1000px;margin:0 auto 18px}
.hero h1{font-family:var(--serif);font-size:clamp(32px,5vw,48px);font-weight:500;margin-bottom:10px}
.lead{color:var(--muted);max-width:50ch;line-height:1.55;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:500}
.btn-dark{background:#1a1714;color:#fff}
.btn-soft{background:#fff;border:1px solid var(--line)}
.btn-blue{background:linear-gradient(120deg,#2f5d8c,#5b4b8a);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;max-width:1000px;margin:0 auto}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h3{font-family:var(--serif);font-size:22px;margin-bottom:6px}
.muted{color:var(--muted);font-size:13px;line-height:1.45;margin-bottom:10px}
.field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:6px 0 10px}
textarea.field{min-height:88px;resize:vertical}
.err{color:#a33;font-size:13px;margin-top:8px;min-height:18px}
.ok{color:#0f766e}
.creator{font-size:12px;padding:8px;border-radius:10px;background:rgba(255,255,255,.75);border:1px solid var(--line);margin-bottom:10px}
.comment{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:#fff}

#frameWrap{position:absolute;inset:0;display:none}
#frameWrap.on{display:block}
#frame{width:100%;height:100%;border:0;background:#fff}
body.full .sidebar,body.full .top{display:none!important}
body.full #app{display:block}
body.full .main,body.full .stage{height:100%}

.modal{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(20,16,12,.5)}
.modal.on{display:flex}
.modal .box{width:min(420px,100%)}
.acc-card{max-width:480px;margin:20px auto;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.acc-card:before{content:"";position:absolute;width:160px;height:160px;right:-30px;top:-30px;border-radius:50%;background:radial-gradient(circle,rgba(91,75,138,.22),transparent 70%)}
</style>
</head>
<body>
<div id="gt"><div id="google_translate_element"></div></div>

<div id="langGate" class="notranslate">
  <div class="box">
    <h1>Choose your language</h1>
    <p>You can change this later from the menu.</p>
    <input class="search" id="langSearch" placeholder="Search language">
    <div class="lang-list" id="langList"></div>
  </div>
</div>

<div id="app" class="notranslate">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="top">
      <div class="title" id="topTitle">Ironpetal</div>
      <div class="menu-wrap">
        <button class="icon" type="button" data-act="menu" aria-label="menu">☰</button>
        <div class="menu" id="menu">
          <button type="button" data-act="lang">Language</button>
          <button type="button" data-act="home">Home</button>
          <button type="button" data-act="account">Account</button>
        </div>
      </div>
    </div>
    <div class="stage">
      <div class="view on" id="homeView"></div>
      <div class="view" id="accountView"></div>
      <div id="frameWrap"><iframe id="frame" title="app"></iframe></div>
    </div>
  </div>
</div>

<div class="modal notranslate" id="gateModal">
  <div class="box">
    <h1 style="font-family:var(--serif);font-size:28px;font-weight:500;margin-bottom:8px">Enter product</h1>
    <p id="gateMsg">Use the public Ironpetal account, or continue with a personal account.</p>
    <div class="row">
      <button class="btn btn-dark" type="button" data-act="gate-public">Public account</button>
      <button class="btn btn-soft" type="button" data-act="gate-personal">Personal account</button>
      <button class="btn btn-soft" type="button" data-act="gate-cancel">Cancel</button>
    </div>
    <p class="muted" id="gateHint" style="margin-top:12px"></p>
  </div>
</div>

<script>
(function(){
  "use strict";

  var RTL = {fa:1,ar:1,ur:1,he:1};
  var LANGS = [
    ["en","English"],["fa","فارسی"],["ja","日本語"],["tr","Türkçe"],["de","Deutsch"],
    ["fr","Français"],["es","Español"],["ar","العربية"],["ru","Русский"],["zh","中文"],
    ["hi","हिन्दी"],["ko","한국어"],["pt","Português"],["it","Italiano"],["id","Indonesia"]
  ];
  var PUBLIC = {lumera:1,host:1,store:1,forge:1,openvex:1};
  var RUBIKA = {
    lumera:"https://rubika.ir/lumera__studio",
    forge:"https://rubika.ir/Rustedwarfar_ForgeofRust",
    openvex:"https://rubika.ir/openvex"
  };
  var MODULES = [
    {id:"lumera",title:"Lumera",src:"modules/lumera.html",group:"suite",desc:"Social canvas",maker:"Hesam",studio:"@lumera__studio",rk:"lumera"},
    {id:"host",title:"Lumera Host",src:"modules/host.html",group:"suite",desc:"Hosting desk",maker:"Hesam",studio:"@lumera__studio",rk:"lumera"},
    {id:"store",title:"Lumera Store",src:"modules/store.html",group:"suite",desc:"Orders desk",maker:"Hesam",studio:"@lumera__studio",rk:"lumera"},
    {id:"luvex",title:"Luvex",src:"modules/luvex.html",group:"suite",desc:"Verification",maker:"Hesam",studio:"@lumera__studio",rk:"lumera"},
    {id:"forge",title:"Rusted Forge",src:"modules/forge.html",group:"suite",desc:"Mods platform",maker:"Amirhossein",studio:"@Rustedwarfar_ForgeofRust",rk:"forge"},
    {id:"openvex",title:"OpenVex",src:"modules/openvex.html",group:"suite",desc:"OpenVex login",maker:"Mohammad Erfan",studio:"@openvex",rk:"openvex"},
    {id:"northink",title:"Northink",src:"modules/northink.html",group:"lab",desc:"Notes",maker:"Ironpetal Lab",studio:"@lumera__studio",rk:"lumera"},
    {id:"pulseboard",title:"Pulseboard",src:"modules/pulseboard.html",group:"lab",desc:"Habits",maker:"Ironpetal Lab",studio:"@lumera__studio",rk:"lumera"},
    {id:"gridcalc",title:"Gridcalc",src:"modules/gridcalc.html",group:"lab",desc:"Calculator",maker:"Ironpetal Lab",studio:"@lumera__studio",rk:"lumera"},
    {id:"linkloom",title:"Linkloom",src:"modules/linkloom.html",group:"lab",desc:"Links",maker:"Ironpetal Lab",studio:"@lumera__studio",rk:"lumera"},
    {id:"quiettimer",title:"QuietTimer",src:"modules/quiettimer.html",group:"lab",desc:"Focus timer",maker:"Ironpetal Lab",studio:"@lumera__studio",rk:"lumera"}
  ];

  var state = {lang: localStorage.getItem("ip_lang") || "", view: "home", pending: null};

  function getUser(){
    try { var r = localStorage.getItem("ip_user"); return r ? JSON.parse(r) : null; } catch(e){ return null; }
  }
  function setUser(u){
    try { localStorage.setItem("ip_user", JSON.stringify(u)); return true; } catch(e){ alert("Storage blocked"); return false; }
  }
  function clearUser(){ try{ localStorage.removeItem("ip_user"); }catch(e){} }
  function comments(id){
    try { return JSON.parse(localStorage.getItem("ip_c_"+id) || "[]"); } catch(e){ return []; }
  }
  function saveComments(id, arr){
    try { localStorage.setItem("ip_c_"+id, JSON.stringify(arr.slice(0,60))); } catch(e){}
  }

  function $(id){ return document.getElementById(id); }

  function showView(name){
    state.view = name;
    document.body.classList.remove("full");
    $("homeView").classList.toggle("on", name === "home");
    $("accountView").classList.toggle("on", name === "account");
    $("frameWrap").classList.toggle("on", name === "module");
    if(name === "module") document.body.classList.add("full");
    $("topTitle").textContent = name === "account" ? "Account" : name === "home" ? "Ironpetal" : (state.modTitle || "Ironpetal");
    drawSidebar();
  }

  function drawSidebar(){
    var html = "";
    function btn(id, label, svg){
      var on = (state.view === "home" && id === "home") || (state.view === "account" && id === "account") || (state.view === "module" && state.modId === id);
      return '<button type="button" class="side-btn'+(on?" on":"")+'" data-act="nav" data-id="'+id+'" title="'+label+'">'+svg+'<span class="tip">'+label+'</span></button>';
    }
    html += btn("home","Home",'⌂');
    html += btn("account","Account",'☺');
    MODULES.forEach(function(m){
      html += btn(m.id, m.title, "•");
    });
    $("sidebar").innerHTML = html;
  }

  function drawHome(){
    var u = getUser();
    var suite = MODULES.filter(function(m){return m.group==="suite";});
    var lab = MODULES.filter(function(m){return m.group==="lab";});
    function card(m){
      var link = RUBIKA[m.rk] || RUBIKA.lumera;
      var list = comments(m.id);
      var chtml = list.map(function(c){
        return '<div class="comment"><b>'+esc(c.by)+'</b>: '+esc(c.text)+'</div>';
      }).join("") || '<p class="muted">No comments yet.</p>';
      return '<article class="card">'+
        '<h3>'+m.title+'</h3>'+
        '<p class="muted">'+m.desc+'</p>'+
        '<div class="creator">Maker: <b>'+m.maker+'</b><br>Studio <a href="'+link+'" target="_blank" rel="noopener">'+m.studio+'</a></div>'+
        '<div class="row"><button type="button" class="btn btn-dark" data-act="open" data-id="'+m.id+'">Open</button></div>'+
        '<div style="margin-top:10px"><div class="muted">Public comments</div>'+chtml+
        (u ? '<input class="field" id="c_'+m.id+'" placeholder="Write a comment">'+
        '<button type="button" class="btn btn-soft" data-act="comment" data-id="'+m.id+'">Post</button>' :
        '<p class="muted">Create an account to comment.</p>')+
        '</div></article>';
    }
    $("homeView").innerHTML =
      '<div class="hero">'+
        '<h1>Crafted with intention.</h1>'+
        '<p class="lead">Open suite products full-screen. Optional Ironpetal account for comments and public login.</p>'+
        '<div class="row">'+
          '<button type="button" class="btn btn-blue" data-act="nav" data-id="account">'+(u ? "My account" : "Create account")+'</button>'+
          '<button type="button" class="btn btn-dark" data-act="open" data-id="lumera">Open Lumera</button>'+
        '</div>'+
        (u ? '<p class="muted" style="margin-top:10px">Signed in as <b>'+esc(u.username)+'</b></p>' : '')+
      '</div>'+
      '<h2 style="max-width:1000px;margin:18px auto 10px;font-family:var(--serif);font-weight:500">Suite</h2>'+
      '<div class="grid">'+suite.map(card).join("")+'</div>'+
      '<h2 style="max-width:1000px;margin:22px auto 10px;font-family:var(--serif);font-weight:500">Lab</h2>'+
      '<div class="grid">'+lab.map(card).join("")+'</div>';
  }

  function drawAccount(){
    var u = getUser();
    if(!u){
      $("accountView").innerHTML =
        '<div class="acc-card">'+
          '<h2 style="font-family:var(--serif);font-size:30px;font-weight:500;margin-bottom:8px">Create account</h2>'+
          '<p class="muted">Simple Ironpetal identity for comments and public product login.</p>'+
          '<form id="regForm">'+
            '<label class="muted">Username</label>'+
            '<input class="field" id="regUser" name="username" autocomplete="username" required>'+
            '<label class="muted">Password</label>'+
            '<input class="field" id="regPass" name="password" type="password" autocomplete="new-password" required>'+
            '<label class="muted">Display name</label>'+
            '<input class="field" id="regName" name="display" autocomplete="nickname">'+
            '<div class="row">'+
              '<button class="btn btn-blue" type="submit">Create account</button>'+
              '<button class="btn btn-soft" type="button" data-act="home">Back home</button>'+
            '</div>'+
            '<p class="err" id="regErr"></p>'+
          '</form>'+
        '</div>';
      $("regForm").onsubmit = function(e){
        e.preventDefault();
        var err = $("regErr");
        var username = ($("regUser").value || "").trim().toLowerCase();
        var password = $("regPass").value || "";
        var display = ($("regName").value || "").trim() || username;
        if(username.length < 3){ err.textContent = "Username at least 3 characters"; return; }
        if(!/^[a-z0-9_\.]+$/i.test(username)){ err.textContent = "Only letters, numbers, _ ."; return; }
        if(password.length < 4){ err.textContent = "Password at least 4 characters"; return; }
        var h = 0, i;
        for(i=0;i<password.length;i++) h = ((h<<5)-h) + password.charCodeAt(i) | 0;
        if(!setUser({username:username, display:display, pass:String(h), bio:"", avatar:"", at:Date.now()})){
          err.textContent = "Could not save";
          return;
        }
        err.className = "err ok";
        err.textContent = "Account created";
        setTimeout(drawAccount, 150);
      };
      return;
    }
    $("accountView").innerHTML =
      '<div class="acc-card">'+
        '<h2 style="font-family:var(--serif);font-size:30px;font-weight:500;margin-bottom:8px">Your account</h2>'+
        '<div class="row" style="align-items:center;margin-bottom:10px">'+
          '<img class="avatar" id="avPrev" alt="" src="'+(u.avatar || defaultAvatar())+'">'+
          '<label class="btn btn-soft">Upload<input type="file" id="avFile" accept="image/*" hidden></label>'+
        '</div>'+
        '<label class="muted">Display name</label>'+
        '<input class="field" id="pName" value="'+escAttr(u.display||"")+'">'+
        '<label class="muted">Bio</label>'+
        '<textarea class="field" id="pBio">'+esc(u.bio||"")+'</textarea>'+
        '<p class="muted">Username: <b>'+esc(u.username)+'</b></p>'+
        '<div class="row">'+
          '<button type="button" class="btn btn-dark" data-act="save-profile">Save profile</button>'+
          '<button type="button" class="btn btn-soft" data-act="signout">Sign out</button>'+
          '<button type="button" class="btn btn-soft" data-act="home">Home</button>'+
        '</div>'+
        '<p class="err" id="pMsg"></p>'+
      '</div>';
    $("avFile").onchange = function(){
      var f = this.files && this.files[0]; if(!f) return;
      var r = new FileReader();
      r.onload = function(){
        var cur = getUser(); if(!cur) return;
        cur.avatar = r.result; setUser(cur); $("avPrev").src = r.result;
      };
      r.readAsDataURL(f);
    };
  }

  function defaultAvatar(){
    return "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect fill='%23e8dccf' width='64' height='64'/%3E%3Ccircle cx='32' cy='26' r='12' fill='%23a89080'/%3E%3C/svg%3E";
  }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];}); }
  function escAttr(s){ return esc(s).replace(/`/g,""); }

  function openGate(id){
    state.pending = id;
    var u = getUser();
    $("gateMsg").textContent = "Use the public Ironpetal account, or open with a personal account inside the product.";
    $("gateHint").textContent = u
      ? ("You are signed in as "+u.username+". Public login uses ironpetal / ironpetal.")
      : "Public account needs an Ironpetal account first. Use Create account.";
    $("gateModal").classList.add("on");
  }
  function closeGate(){ state.pending = null; $("gateModal").classList.remove("on"); }

  function openModule(id, mode){
    var m = null;
    for(var i=0;i<MODULES.length;i++) if(MODULES[i].id===id) m = MODULES[i];
    if(!m) return;
    state.modId = id;
    state.modTitle = m.title;
    showView("module");
    if(mode === "public"){
      try { localStorage.setItem("ip_public_login", JSON.stringify({user:"ironpetal", pass:"ironpetal", site:id})); } catch(e){}
    } else {
      try { localStorage.removeItem("ip_public_login"); } catch(e){}
    }
    var frame = $("frame");
    frame.onload = function(){
      try {
        frame.contentWindow.postMessage({type:"ip-lang", lang: state.lang||"en"}, "*");
        if(frame.contentWindow.localStorage) frame.contentWindow.localStorage.setItem("ip_lang", state.lang||"en");
      } catch(e){}
    };
    frame.src = m.src + "?embed=1&v=" + Date.now() + (mode==="public" ? "&pub=1" : "");
  }

  function requestOpen(id){
    if(id === "home"){ showView("home"); drawHome(); return; }
    if(id === "account"){ showView("account"); drawAccount(); return; }
    if(PUBLIC[id]){ openGate(id); return; }
    openModule(id, "personal");
  }

  // Single click handler for almost everything
  document.addEventListener("click", function(e){
    var t = e.target;
    if(!t) return;
    // climb for data-act
    var el = t;
    for(var i=0;i<5 && el; i++, el=el.parentElement){
      if(el.getAttribute && el.getAttribute("data-act")) break;
    }
    if(!el || !el.getAttribute) return;
    var act = el.getAttribute("data-act");
    if(!act) return;

    if(act === "menu"){
      $("menu").classList.toggle("open");
      return;
    }
    $("menu").classList.remove("open");

    if(act === "lang"){
      $("app").classList.remove("show");
      $("langGate").classList.remove("hide");
      return;
    }
    if(act === "home"){ requestOpen("home"); return; }
    if(act === "account" || (act === "nav" && el.getAttribute("data-id")==="account")){ requestOpen("account"); return; }
    if(act === "nav"){ requestOpen(el.getAttribute("data-id")); return; }
    if(act === "open"){ requestOpen(el.getAttribute("data-id")); return; }
    if(act === "comment"){
      var u = getUser(); if(!u) return;
      var id = el.getAttribute("data-id");
      var input = $("c_"+id); if(!input) return;
      var text = (input.value || "").trim(); if(!text) return;
      var arr = comments(id);
      arr.unshift({by:u.username, text:text, at:Date.now()});
      saveComments(id, arr);
      drawHome();
      return;
    }
    if(act === "gate-public"){
      var pid = state.pending;
      if(!getUser()){ $("gateHint").textContent = "Create an Ironpetal account first."; return; }
      closeGate();
      if(pid) openModule(pid, "public");
      return;
    }
    if(act === "gate-personal"){
      var pid2 = state.pending;
      closeGate();
      if(pid2) openModule(pid2, "personal");
      return;
    }
    if(act === "gate-cancel"){ closeGate(); return; }
    if(act === "save-profile"){
      var cur = getUser(); if(!cur) return;
      cur.display = (($("pName") && $("pName").value) || "").trim() || cur.username;
      cur.bio = (($("pBio") && $("pBio").value) || "").trim();
      setUser(cur);
      if($("pMsg")){ $("pMsg").className="err ok"; $("pMsg").textContent="Saved"; }
      return;
    }
    if(act === "signout"){ clearUser(); drawAccount(); return; }
  });

  // language list
  function drawLang(filter){
    var q = (filter||"").toLowerCase();
    var box = $("langList");
    box.innerHTML = "";
    LANGS.forEach(function(L){
      if(q && L[0].indexOf(q)<0 && L[1].toLowerCase().indexOf(q)<0) return;
      var b = document.createElement("button");
      b.type = "button";
      b.className = "lang-item";
      b.innerHTML = "<span>"+L[1]+"</span><small>"+L[0]+"</small>";
      b.onclick = function(){ setLang(L[0]); };
      box.appendChild(b);
    });
  }
  function setLang(code){
    state.lang = code;
    try { localStorage.setItem("ip_lang", code); } catch(e){}
    document.documentElement.lang = code;
    document.documentElement.dir = RTL[code] ? "rtl" : "ltr";
    $("langGate").classList.add("hide");
    $("app").classList.add("show");
    showView("home");
    drawHome();
  }
  $("langSearch").oninput = function(){ drawLang(this.value); };
  drawLang("");

  // messages from modules
  window.addEventListener("message", function(e){
    if(!e.data) return;
    if(e.data.type === "ip-home") requestOpen("home");
  });

  // start
  if(state.lang){
    setLang(state.lang);
  }
})();
</script>
</body>
</html>
