<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ironpetal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 4c4 6 10 8 10 14a10 10 0 1 1-20 0c0-6 6-8 10-14z' fill='%233f3a36'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1714;--muted:#6f675f;--line:rgba(26,23,20,.1);
  --paper:rgba(251,247,241,.92);--sidebar:78px;
  --font:"IBM Plex Sans",system-ui,sans-serif;--serif:"Cormorant Garamond",Georgia,serif;
  --shadow:0 18px 50px rgba(40,30,20,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);overflow:hidden;background:#efe6db url("bg.png") center/cover no-repeat fixed;top:0!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
.goog-te-banner-frame,.goog-te-balloon-frame,#goog-gt-tt,.goog-tooltip,.goog-te-spinner-pos,.goog-logo-link,.goog-te-gadget,.skiptranslate{display:none!important}
#ipGtBox{position:absolute;width:0;height:0;overflow:hidden;opacity:0;pointer-events:none}

#langGate{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(239,230,219,.95);backdrop-filter:blur(10px)}
#langGate.hidden{display:none}
.lang-box{width:min(560px,100%);background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:28px 22px 20px;animation:rise .4s ease}
.lang-box h1{font-family:var(--serif);font-size:clamp(28px,4vw,40px);font-weight:500;margin-bottom:8px}
.lang-box p{color:var(--muted);font-size:14px;margin-bottom:14px;line-height:1.5}
.lang-search{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;outline:none}
.lang-list{max-height:300px;overflow:auto;display:grid;gap:4px}
.lang-item{text-align:start;padding:10px 12px;border-radius:10px;display:flex;justify-content:space-between;gap:8px}
.lang-item:hover{background:rgba(26,23,20,.05)}
.lang-item small{color:var(--muted)}

#app{display:none;height:100%;position:relative;z-index:1}
#app.show{display:flex}
.sidebar{width:var(--sidebar);flex-shrink:0;height:100%;border-inline-end:1px solid var(--line);background:rgba(251,247,241,.9);backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;z-index:5;overflow-y:auto}
.brand{width:38px;height:38px;border-radius:12px;margin-bottom:4px;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
.side-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;position:relative;flex-shrink:0;transition:.15s}
.side-btn:hover{background:rgba(26,23,20,.05)}
.side-btn.active{background:#fff;border:1px solid var(--line);box-shadow:0 8px 18px rgba(40,30,20,.06)}
.side-btn .tip{position:absolute;inset-inline-start:52px;top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;font-size:11px;padding:5px 8px;border-radius:7px;opacity:0;pointer-events:none;white-space:nowrap;z-index:40}
.side-btn:hover .tip{opacity:1}
.side-spacer{flex:1;min-height:8px}

.main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(251,247,241,.88);backdrop-filter:blur(14px);position:relative;z-index:50}
.top-title{font-family:var(--serif);font-size:20px;font-weight:500}
.menu-wrap{position:relative;z-index:60}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.menu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;width:220px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;z-index:80}
.menu.open{display:block}
.menu button{width:100%;text-align:start;padding:10px 11px;border-radius:9px;font-size:13px}
.menu button:hover{background:rgba(26,23,20,.05)}

.stage{flex:1;position:relative;overflow:hidden}
.scroll-home{position:absolute;inset:0;overflow:auto;padding:0;display:none;scroll-behavior:smooth}
.scroll-home.show{display:block}
.scroll-home::-webkit-scrollbar{width:8px}
.scroll-home::-webkit-scrollbar-thumb{background:rgba(26,23,20,.15);border-radius:99px}

.hero-band{
  padding:36px 24px 28px;max-width:1100px;margin:0 auto;
  display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center;
}
@media(max-width:900px){.hero-band{grid-template-columns:1fr;padding:28px 18px}}
.hero-band h1{font-family:var(--serif);font-size:clamp(34px,5vw,54px);font-weight:500;line-height:1.05;margin-bottom:12px}
.hero-band .lead{color:var(--muted);line-height:1.6;max-width:48ch;margin-bottom:18px}
.hero-art{
  min-height:220px;border-radius:28px;border:1px solid var(--line);
  background:
    linear-gradient(145deg,rgba(255,255,255,.92),rgba(232,214,196,.5)),
    radial-gradient(circle at 70% 30%,rgba(196,150,130,.25),transparent 55%);
  position:relative;overflow:hidden;
}
.hero-art::after{
  content:"";position:absolute;width:46%;aspect-ratio:.7;right:12%;top:12%;
  border:1.5px solid rgba(160,120,90,.35);border-radius:50% 50% 42% 42%;
  transform:rotate(16deg);animation:float 7s ease-in-out infinite;
}
.pad{padding:8px 24px 48px;max-width:1100px;margin:0 auto}
@media(max-width:900px){.pad{padding:8px 16px 40px}}
.section{margin:28px 0 12px;font-family:var(--serif);font-size:26px;font-weight:500}
.section span{display:block;font-family:var(--font);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{
  background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;
  transition:transform .2s,box-shadow .2s;backdrop-filter:blur(6px);
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card .ico{width:36px;height:36px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;margin-bottom:8px;font-size:16px}
.card h3{font-family:var(--serif);font-size:22px;font-weight:500;margin-bottom:6px}
.card .desc{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:10px;min-height:40px}
.creator{font-size:12px;line-height:1.45;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.75);border:1px solid var(--line);margin-bottom:12px}
.creator a{color:#0f766e;text-decoration:underline;font-weight:600}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:500;transition:.15s}
.btn:hover{transform:translateY(-1px)}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:#fff;border:1px solid var(--line)}
.feature{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:8px 0 8px}
.feature .f{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;transition:.18s}
.feature .f:hover{box-shadow:var(--shadow)}
.feature h4{font-size:14px;margin-bottom:6px}
.feature p{font-size:12px;color:var(--muted);line-height:1.45}
.quote{
  margin:28px 0;padding:22px 24px;border-radius:20px;border:1px solid var(--line);
  background:linear-gradient(120deg,rgba(255,252,247,.9),rgba(236,220,200,.45));
  font-family:var(--serif);font-size:clamp(20px,3vw,28px);line-height:1.35;
}
.quote small{display:block;margin-top:10px;font-family:var(--font);font-size:12px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.step{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px}
.step b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.strip{
  margin:20px 0;padding:18px;border-radius:18px;border:1px dashed rgba(26,23,20,.15);
  background:rgba(255,255,255,.45);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px}
.footer-note{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.5}

.frame-wrap{position:absolute;inset:0;display:none;flex-direction:column}
.frame-wrap.show{display:flex}
.mod-chrome{flex-shrink:0;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(251,247,241,.95);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.mod-chrome .meta{font-size:12px;color:var(--muted);line-height:1.4}
.mod-chrome .meta a{color:#0f766e;font-weight:600}
.mod-chrome strong{color:var(--ink);font-size:14px}
iframe{flex:1;width:100%;border:0;background:#fff}
.loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(251,247,241,.75);z-index:3;color:var(--muted)}
.loading.show{display:flex}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:rotate(16deg) translateY(0)}50%{transform:rotate(16deg) translateY(-10px)}}
</style>
</head>
<body>
<div id="ipGtBox"><div id="google_translate_element"></div></div>

<div id="langGate">
  <div class="lang-box">
    <h1>Choose your language</h1>
    <p>The entire Ironpetal desk and every product inside will follow this language.</p>
    <input class="lang-search" id="langSearch" type="search" placeholder="Search language or country…">
    <div class="lang-list" id="langList"></div>
  </div>
</div>

<div id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div class="top-title" id="topTitle">Ironpetal</div>
      <div class="menu-wrap">
        <button class="icon-btn" id="menuBtn" aria-label="menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="menu" id="settingsMenu">
          <button type="button" id="changeLangBtn">Language</button>
          <button type="button" id="goHomeBtn">Home</button>
          <button type="button" id="reloadBtn">Reload</button>
        </div>
      </div>
    </header>
    <div class="stage">
      <div class="loading" id="loading">Loading…</div>
      <div class="scroll-home show" id="home"></div>
      <div class="frame-wrap" id="frameWrap">
        <div class="mod-chrome" id="modChrome"></div>
        <iframe id="frame" title="module" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads"></iframe>
      </div>
    </div>
  </div>
</div>

<script>
const RTL=new Set(["fa","ar","ur","he"]);
const LANGS=[
{code:"en",name:"English",region:"Global"},{code:"fa",name:"فارسی",region:"Iran"},
{code:"ja",name:"日本語",region:"Japan"},{code:"tr",name:"Türkçe",region:"Türkiye"},
{code:"de",name:"Deutsch",region:"Germany"},{code:"fr",name:"Français",region:"France"},
{code:"es",name:"Español",region:"Spain"},{code:"ar",name:"العربية",region:"Middle East"},
{code:"ru",name:"Русский",region:"Russia"},{code:"zh",name:"中文",region:"China"},
{code:"hi",name:"हिन्दी",region:"India"},{code:"ur",name:"اردو",region:"Pakistan"},
{code:"pt",name:"Português",region:"Brazil"},{code:"it",name:"Italiano",region:"Italy"},
{code:"ko",name:"한국어",region:"Korea"},{code:"id",name:"Bahasa Indonesia",region:"Indonesia"},
{code:"nl",name:"Nederlands",region:"Netherlands"},{code:"pl",name:"Polski",region:"Poland"},
{code:"az",name:"Azərbaycan",region:"Azerbaijan"},{code:"sv",name:"Svenska",region:"Sweden"},
{code:"uk",name:"Українська",region:"Ukraine"},{code:"th",name:"ไทย",region:"Thailand"},
{code:"vi",name:"Tiếng Việt",region:"Vietnam"}
];
const GT_MAP={zh:"zh-CN",he:"iw"};
function gtCode(l){l=(l||"en").toLowerCase();return GT_MAP[l]||l;}
const RUBIKA={lumera:"https://rubika.ir/lumera__studio",forge:"https://rubika.ir/Rustedwarfar_ForgeofRust",openvex:"https://rubika.ir/openvex"};
const MODULES=[
  {id:"lumera",title:"Lumera",src:"modules/lumera.html",group:"suite",desc:"Social canvas — posts, presence, explore.",maker:"Hesam",studio:"@lumera__studio",rubika:"lumera",emoji:"✦"},
  {id:"host",title:"Lumera Host",src:"modules/host.html",group:"suite",desc:"Publish pages from a clean host desk.",maker:"Hesam",studio:"@lumera__studio",rubika:"lumera",emoji:"▣"},
  {id:"store",title:"Lumera Store",src:"modules/store.html",group:"suite",desc:"Studio orders and service requests.",maker:"Hesam",studio:"@lumera__studio",rubika:"lumera",emoji:"BAG"},
  {id:"luvex",title:"Luvex",src:"modules/luvex.html",group:"suite",desc:"Site verification and registry desk.",maker:"Hesam",studio:"@lumera__studio",rubika:"lumera",emoji:"◎"},
  {id:"forge",title:"Rusted Forge",src:"modules/forge.html",group:"suite",desc:"Mods platform with full forge tools.",maker:"Amirhossein",studio:"@Rustedwarfar_ForgeofRust",rubika:"forge",emoji:"⚙"},
  {id:"openvex",title:"OpenVex",src:"modules/openvex.html",group:"suite",desc:"Secure login desk for OpenVex.",maker:"Mohammad Erfan",studio:"@openvex",rubika:"openvex",emoji:"◆"},
  {id:"northink",title:"Northink",src:"modules/northink.html",group:"lab",desc:"Fast local notes on this device.",maker:"Ironpetal Lab",studio:"@lumera__studio",rubika:"lumera",emoji:"✎"},
  {id:"pulseboard",title:"Pulseboard",src:"modules/pulseboard.html",group:"lab",desc:"Daily habits checklist.",maker:"Ironpetal Lab",studio:"@lumera__studio",rubika:"lumera",emoji:"✓"},
  {id:"gridcalc",title:"Gridcalc",src:"modules/gridcalc.html",group:"lab",desc:"Quick expression calculator.",maker:"Ironpetal Lab",studio:"@lumera__studio",rubika:"lumera",emoji:"＋"},
  {id:"linkloom",title:"Linkloom",src:"modules/linkloom.html",group:"lab",desc:"Save and open personal links.",maker:"Ironpetal Lab",studio:"@lumera__studio",rubika:"lumera",emoji:"⛓"},
  {id:"quiettimer",title:"QuietTimer",src:"modules/quiettimer.html",group:"lab",desc:"25-minute focus timer.",maker:"Ironpetal Lab",studio:"@lumera__studio",rubika:"lumera",emoji:"◷"}
];
const state={lang:localStorage.getItem("ip_lang")||"",mod:"home"};

function forceGoogleLang(lang){
  const c=gtCode(lang);
  try{
    document.cookie="googtrans=/auto/"+c+";path=/";
    document.cookie="googtrans=/auto/"+c+";path=/;domain="+location.hostname;
  }catch(e){}
  const sel=document.querySelector("select.goog-te-combo");
  if(!sel){setTimeout(function(){forceGoogleLang(lang);},200);return;}
  if(sel.value!==c){sel.value=c;sel.dispatchEvent(new Event("change"));}
  // second pulse for stubborn widgets
  setTimeout(function(){
    const s2=document.querySelector("select.goog-te-combo");
    if(s2&&s2.value!==c){s2.value=c;s2.dispatchEvent(new Event("change"));}
  },600);
}
function googleTranslateElementInit(){
  new google.translate.TranslateElement({
    pageLanguage:"auto",
    includedLanguages:"en,fa,ja,tr,de,fr,es,ar,ru,zh-CN,hi,ur,pt,it,ko,id,nl,pl,az,sv,uk,th,vi,ms,bn,iw",
    autoDisplay:false,multilanguagePage:true
  },"google_translate_element");
  if(state.lang) setTimeout(function(){forceGoogleLang(state.lang);},900);
}
window.googleTranslateElementInit=googleTranslateElementInit;

function injectFrameTranslate(frame,lang){
  try{
    const c=gtCode(lang);
    try{frame.contentWindow.localStorage.setItem("ip_lang",lang);}catch(e){}
    frame.contentWindow.postMessage({type:"ip-lang",lang:lang,dir:RTL.has(lang)?"rtl":"ltr"},"*");
    if(typeof frame.contentWindow.ipForceTranslate==="function") frame.contentWindow.ipForceTranslate(lang);
    const doc=frame.contentDocument;
    if(!doc) return;
    try{doc.cookie="googtrans=/auto/"+c+";path=/";}catch(e){}
    if(!doc.getElementById("ip-gt-src")){
      const s=doc.createElement("script");s.id="ip-gt-src";
      s.src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";
      doc.head.appendChild(s);
    }
    function pulse(){
      try{
        const sel=doc.querySelector("select.goog-te-combo");
        if(sel){sel.value=c;sel.dispatchEvent(new Event("change"));}
      }catch(e){}
    }
    setTimeout(pulse,250);
    setTimeout(pulse,700);
    setTimeout(pulse,1500);
  }catch(e){}
}

function creatorBlock(m){
  const link=RUBIKA[m.rubika]||RUBIKA.lumera;
  return `<div class="creator">Maker: <strong>${m.maker}</strong><br>Studio <a href="${link}" target="_blank" rel="noopener">${m.studio}</a> · <a href="${link}" target="_blank" rel="noopener">Rubika channel</a></div>`;
}

function renderSidebar(){
  const icons={
    home:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-5v-5H10v5H5a1 1 0 0 1-1-1v-8.5z"/></svg>',
    lumera:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5b4b8a" stroke-width="1.6"><circle cx="12" cy="12" r="3"/></svg>',
    host:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2f5d8c" stroke-width="1.6"><rect x="4" y="4" width="16" height="6" rx="1.5"/><rect x="4" y="14" width="16" height="6" rx="1.5"/></svg>',
    store:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3d6b4f" stroke-width="1.6"><path d="M6 8h12l-1 11H7L6 8z"/></svg>',
    luvex:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="1.6"><path d="M12 3l7 4v6c0 4-3 7-7 8-4-1-7-4-7-8V7l7-4z"/></svg>',
    forge:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b45309" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>',
    openvex:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="1.6"><path d="M4 12h16M12 4v16"/></svg>',
    northink:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5b4b8a" stroke-width="1.6"><path d="M6 4h12v16H6z"/></svg>',
    pulseboard:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="1.6"><path d="M4 12h4l2-6 4 12 2-6h4"/></svg>',
    gridcalc:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2f5d8c" stroke-width="1.6"><rect x="5" y="3" width="14" height="18" rx="2"/></svg>',
    linkloom:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8a6a2f" stroke-width="1.6"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/></svg>',
    quiettimer:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3d6b4f" stroke-width="1.6"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/></svg>'
  };
  const sb=document.getElementById("sidebar");
  let h=`<div class="brand"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3c3 4 7 5.5 7 10a7 7 0 1 1-14 0c0-4.5 4-6 7-10z"/></svg></div>
  <button class="side-btn ${state.mod==="home"?"active":""}" data-mod="home">${icons.home}<span class="tip">Home</span></button>`;
  MODULES.forEach(m=>{h+=`<button class="side-btn ${state.mod===m.id?"active":""}" data-mod="${m.id}">${icons[m.id]||icons.home}<span class="tip">${m.title}</span></button>`;});
  h+=`<div class="side-spacer"></div>`;
  sb.innerHTML=h;
  sb.querySelectorAll(".side-btn").forEach(b=>b.onclick=()=>openMod(b.dataset.mod));
}

function renderHome(){
  const suite=MODULES.filter(m=>m.group==="suite");
  const lab=MODULES.filter(m=>m.group==="lab");
  const card=m=>`<article class="card"><div class="ico">${m.emoji}</div><h3>${m.title}</h3><p class="desc">${m.desc}</p>${creatorBlock(m)}<div class="btn-row"><button class="btn btn-dark" data-open="${m.id}">Open</button></div></article>`;
  document.getElementById("home").innerHTML=`
  <section class="hero-band">
    <div>
      <h1>Crafted with intention.</h1>
      <p class="lead">A calm home for the full suite — Lumera, Host, Store, Luvex, Forge, OpenVex, and quiet lab tools. Everything opens inside this desk. Your language follows you.</p>
      <div class="btn-row">
        <button class="btn btn-dark" data-open="lumera">Open Lumera</button>
        <button class="btn btn-ghost" data-open="northink">Try a lab tool</button>
      </div>
    </div>
    <div class="hero-art" aria-hidden="true"></div>
  </section>
  <div class="pad">
    <div class="feature">
      <div class="f"><h4>Full-language desk</h4><p>Pick Japanese, Turkish, Persian, or any listed language — the shell and modules translate together.</p></div>
      <div class="f"><h4>Creator credits</h4><p>Every product shows its maker and studio, with a direct Rubika channel link.</p></div>
      <div class="f"><h4>Stay in the frame</h4><p>No random tab jumps for suite tools — open modules inside Ironpetal.</p></div>
      <div class="f"><h4>Soft utility lab</h4><p>Notes, habits, timer, links, and calculator for everyday use.</p></div>
    </div>

    <h2 class="section"><span>Suite</span>Products inside the shell</h2>
    <div class="grid">${suite.map(card).join("")}</div>

    <div class="quote">“Quiet software should feel considered — not loud.”<small>Ironpetal design note</small></div>

    <h2 class="section"><span>Lab</span>Small tools, same calm UI</h2>
    <div class="grid">${lab.map(card).join("")}</div>

    <h2 class="section"><span>Guide</span>How to use the desk</h2>
    <div class="steps">
      <div class="step"><b>Step 1</b><p>Choose your language on first visit. Change it anytime from the top menu.</p></div>
      <div class="step"><b>Step 2</b><p>Open a suite product from the sidebar or the cards below the hero.</p></div>
      <div class="step"><b>Step 3</b><p>Read maker credits and visit the studio channel when you need support.</p></div>
      <div class="step"><b>Step 4</b><p>Use Lab tools for notes, focus, and quick links without leaving Ironpetal.</p></div>
    </div>

    <div class="strip">
      <div>
        <strong>Language is active</strong>
        <p class="desc" style="margin:4px 0 0">Current choice is stored on this device and applied to modules.</p>
      </div>
      <div class="chips">
        <span class="chip">EN</span><span class="chip">FA</span><span class="chip">JA</span><span class="chip">TR</span><span class="chip">DE</span><span class="chip">AR</span><span class="chip">+ more</span>
      </div>
    </div>

    <h2 class="section"><span>Studios</span>Who builds what</h2>
    <div class="grid">
      <article class="card"><h3>Lumera Studio</h3><p class="desc">Lumera, Host, Store, Luvex — maker Hesam.</p>${creatorBlock({maker:"Hesam",studio:"@lumera__studio",rubika:"lumera"})}</article>
      <article class="card"><h3>Forge of Rust</h3><p class="desc">Rusted Forge — maker Amirhossein.</p>${creatorBlock({maker:"Amirhossein",studio:"@Rustedwarfar_ForgeofRust",rubika:"forge"})}</article>
      <article class="card"><h3>OpenVex</h3><p class="desc">OpenVex desk — maker Mohammad Erfan.</p>${creatorBlock({maker:"Mohammad Erfan",studio:"@openvex",rubika:"openvex"})}</article>
    </div>

    <p class="footer-note">Ironpetal is a presentation shell. Product data still follows each module’s own backend rules. Scroll freely — more sections live on this home desk.</p>
  </div>`;
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openMod(b.getAttribute("data-open")));
  forceGoogleLang(state.lang||"en");
}

function openMod(id){
  state.mod=id;renderSidebar();
  const home=document.getElementById("home"), wrap=document.getElementById("frameWrap");
  const loading=document.getElementById("loading"), frame=document.getElementById("frame");
  if(id==="home"){
    wrap.classList.remove("show");home.classList.add("show");
    document.getElementById("topTitle").textContent="Ironpetal";
    loading.classList.remove("show");renderHome();return;
  }
  const m=MODULES.find(x=>x.id===id);if(!m)return;
  home.classList.remove("show");wrap.classList.add("show");
  document.getElementById("topTitle").textContent=m.title;
  const link=RUBIKA[m.rubika]||RUBIKA.lumera;
  document.getElementById("modChrome").innerHTML=`<div><strong>${m.title}</strong><div class="meta">Maker: ${m.maker} · Studio <a href="${link}" target="_blank" rel="noopener">${m.studio}</a></div></div>
  <div class="btn-row"><a class="btn btn-ghost" href="${link}" target="_blank" rel="noopener">Channel</a><button class="btn btn-ghost" id="backHome">Home</button></div>`;
  document.getElementById("backHome").onclick=()=>openMod("home");
  loading.classList.add("show");
  frame.onload=function(){loading.classList.remove("show");injectFrameTranslate(frame,state.lang||"en");forceGoogleLang(state.lang||"en");};
  frame.src=m.src+"?v="+Date.now()+"&lang="+(state.lang||"en");
}

function setLang(code){
  state.lang=code;try{localStorage.setItem("ip_lang",code);}catch(e){}
  document.documentElement.lang=code;document.documentElement.dir=RTL.has(code)?"rtl":"ltr";
  document.getElementById("langGate").classList.add("hidden");document.getElementById("app").classList.add("show");
  forceGoogleLang(code);renderSidebar();
  if(state.mod==="home")renderHome();else openMod(state.mod);
}
function renderLangList(filter){
  const q=(filter||"").trim().toLowerCase();
  const list=document.getElementById("langList");list.innerHTML="";
  LANGS.filter(l=>!q||l.name.toLowerCase().includes(q)||l.region.toLowerCase().includes(q)||l.code.includes(q)).forEach(l=>{
    const b=document.createElement("button");b.type="button";b.className="lang-item";
    b.innerHTML=`<span>${l.name}</span><small>${l.region}</small>`;b.onclick=()=>setLang(l.code);list.appendChild(b);
  });
}
document.getElementById("langSearch").oninput=e=>renderLangList(e.target.value);
document.getElementById("menuBtn").onclick=e=>{e.stopPropagation();document.getElementById("settingsMenu").classList.toggle("open");};
document.addEventListener("click",e=>{if(!e.target.closest(".menu-wrap"))document.getElementById("settingsMenu").classList.remove("open");});
document.getElementById("changeLangBtn").onclick=()=>{document.getElementById("settingsMenu").classList.remove("open");document.getElementById("app").classList.remove("show");document.getElementById("langGate").classList.remove("hidden");renderLangList();};
document.getElementById("goHomeBtn").onclick=()=>{document.getElementById("settingsMenu").classList.remove("open");openMod("home");};
document.getElementById("reloadBtn").onclick=()=>{document.getElementById("settingsMenu").classList.remove("open");openMod(state.mod);};
(function(){const s=document.createElement("script");s.src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";document.head.appendChild(s);})();
renderLangList();
if(state.lang)setLang(state.lang);
</script>
</body>
</html>
