<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index,follow">
<title>Ironpetal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 4c4 6 10 8 10 14a10 10 0 1 1-20 0c0-6 6-8 10-14z' fill='%233f3a36'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe6db;
  --paper:#fbf7f1;
  --ink:#1a1714;
  --muted:#6f675f;
  --line:rgba(26,23,20,.1);
  --accent:#3a342e;
  --soft:#e8dfd3;
  --sidebar:78px;
  --font:"IBM Plex Sans",system-ui,sans-serif;
  --serif:"Cormorant Garamond",Georgia,serif;
  --shadow:0 20px 50px rgba(40,30,20,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  color:var(--ink);
  background-color:var(--bg);
  overflow:hidden;
}
body::before{
  content:"";
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1200px 600px at 0% 0%, rgba(255,255,255,.55), transparent 55%),
    radial-gradient(900px 500px at 100% 10%, rgba(198,170,140,.28), transparent 50%),
    radial-gradient(700px 500px at 80% 100%, rgba(160,130,110,.18), transparent 45%),
    linear-gradient(180deg,#f3ebe1 0%, #e9dfd2 100%);
}
body::after{
  content:"";
  position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
  background-image:url("data:image/svg+xml,%3Csvg width='160' height='160' viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23c4a88a' stroke-width='1' opacity='0.35'%3E%3Cpath d='M20 120c20-40 40-60 60-80 10 20 30 40 40 70'/%3E%3Cpath d='M90 20c10 25 10 45-5 70'/%3E%3C/g%3E%3C/svg%3E");
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}

#langGate{
  position:fixed;inset:0;z-index:1000;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  background:
    radial-gradient(800px 400px at 50% -10%, rgba(255,255,255,.75), transparent 60%),
    linear-gradient(180deg,#f4ece3,#e8ddd0);
}
#langGate.hidden{display:none}
.lang-box{
  width:min(540px,100%);
  background:rgba(251,247,241,.92);
  border:1px solid var(--line);
  border-radius:26px;
  box-shadow:var(--shadow);
  padding:32px 24px 22px;
  animation:rise .45s ease both;
}
.lang-box h1{font-family:var(--serif);font-size:clamp(30px,5vw,42px);font-weight:500;margin-bottom:8px}
.lang-box p{color:var(--muted);font-size:14px;margin-bottom:18px;line-height:1.5}
.lang-search{
  width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;
  padding:13px 14px;margin-bottom:12px;outline:none;
}
.lang-list{max-height:300px;overflow:auto;display:grid;gap:5px}
.lang-item{
  text-align:left;padding:11px 12px;border-radius:11px;
  display:flex;justify-content:space-between;gap:10px;
  border:1px solid transparent;
}
.lang-item:hover,.lang-item.active{background:rgba(26,23,20,.05)}
.lang-item small{color:var(--muted)}

#app{position:relative;z-index:1;display:none;height:100%}
#app.show{display:flex;animation:fadein .35s ease}
.sidebar{
  width:var(--sidebar);flex-shrink:0;height:100%;
  border-right:1px solid var(--line);
  background:rgba(251,247,241,.78);
  backdrop-filter:blur(12px);
  display:flex;flex-direction:column;align-items:center;
  padding:16px 0 12px;gap:6px;z-index:5;
}
.brand{
  width:40px;height:40px;border-radius:13px;margin-bottom:8px;
  background:#fff;border:1px solid var(--line);
  display:grid;place-items:center;
  box-shadow:0 8px 18px rgba(40,30,20,.05);
}
.brand svg{width:20px;height:20px}
.side-btn{
  width:46px;height:46px;border-radius:15px;
  display:grid;place-items:center;position:relative;
  transition:background .18s,transform .18s,box-shadow .18s;
}
.side-btn svg{width:21px;height:21px}
.side-btn:hover{background:rgba(26,23,20,.05);transform:translateY(-1px)}
.side-btn.active{
  background:#fff;border:1px solid var(--line);
  box-shadow:0 10px 22px rgba(40,30,20,.07);
}
.side-btn .tip{
  position:absolute;left:54px;top:50%;transform:translateY(-50%);
  background:var(--ink);color:#fff;font-size:11px;padding:5px 8px;border-radius:7px;
  opacity:0;pointer-events:none;white-space:nowrap;transition:opacity .15s;
}
[dir="rtl"] .side-btn .tip{left:auto;right:54px}
.side-btn:hover .tip{opacity:1}
.side-spacer{flex:1}

.main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;overflow:hidden}
.topbar{
  height:60px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;border-bottom:1px solid var(--line);
  background:rgba(251,247,241,.7);backdrop-filter:blur(12px);
}
.top-title{font-family:var(--serif);font-size:22px;font-weight:500}
.menu-wrap{position:relative}
.icon-btn{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
  background:#fff;display:grid;place-items:center;
}
.icon-btn:hover{background:var(--soft)}
.menu{
  position:absolute;top:44px;right:0;width:210px;
  background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);padding:6px;display:none;z-index:30;
  max-height:min(280px,70vh);overflow:auto;
}
[dir="rtl"] .menu{right:auto;left:0}
.menu.open{display:block;animation:pop .18s ease}
.menu button{width:100%;text-align:left;padding:10px 11px;border-radius:9px;font-size:13px}
[dir="rtl"] .menu button{text-align:right}
.menu button:hover{background:rgba(26,23,20,.05)}

.content{flex:1;overflow:auto;padding:24px 22px 36px}
.content::-webkit-scrollbar{width:7px}
.content::-webkit-scrollbar-thumb{background:rgba(26,23,20,.14);border-radius:99px}

.panel{animation:rise .4s ease both}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;align-items:center;margin-bottom:22px}
@media(max-width:900px){.hero{grid-template-columns:1fr}.sidebar{width:70px}}
.hero h1{font-family:var(--serif);font-size:clamp(34px,5vw,52px);line-height:1.05;margin-bottom:10px}
.hero p{color:var(--muted);max-width:46ch;line-height:1.6;margin-bottom:18px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:11px 16px;border-radius:999px;font-size:13px;font-weight:500;
  transition:transform .15s,background .15s;
}
.btn:hover{transform:translateY(-1px)}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:#fff;border:1px solid var(--line)}
.hero-art{
  min-height:210px;border-radius:24px;border:1px solid var(--line);
  background:
    linear-gradient(145deg, rgba(255,255,255,.9), rgba(232,214,196,.5)),
    radial-gradient(circle at 70% 30%, rgba(180,140,110,.22), transparent 55%);
  position:relative;overflow:hidden;
}
.hero-art i{
  position:absolute;width:120px;height:160px;right:12%;top:12%;
  border:1.5px solid rgba(160,120,90,.35);border-radius:50% 50% 45% 45%;
  transform:rotate(18deg);animation:float 6s ease-in-out infinite;
}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
@media(max-width:800px){.grid3{grid-template-columns:1fr}}
.card{
  background:rgba(251,247,241,.9);border:1px solid var(--line);border-radius:16px;
  padding:18px;box-shadow:0 10px 28px rgba(40,30,20,.03);
  transition:transform .2s,box-shadow .2s;
}
.card:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(40,30,20,.06)}
.card h3{font-family:var(--serif);font-size:22px;font-weight:500;margin:8px 0}
.card p{color:var(--muted);font-size:13px;line-height:1.55}

body[data-product="lumera"]{--accent:#5b4b8a;--soft:#ebe6f5}
body[data-product="host"]{--accent:#2f5d8c;--soft:#e6eef6}
body[data-product="store"]{--accent:#3d6b4f;--soft:#e7f0ea}
body[data-product="future"]{--accent:#0f766e;--soft:#e6f4f2}
body[data-product="royal"]{--accent:#8a6a2f;--soft:#f3ecd9}

.product-banner{
  border:1px solid var(--line);border-radius:22px;padding:20px;
  background:linear-gradient(120deg,#fffaf4,var(--soft));
  margin-bottom:16px;
}
.product-banner .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px}
.product-banner h2{font-family:var(--serif);font-size:32px;font-weight:500;margin-bottom:6px}
.product-banner p{color:var(--muted);line-height:1.55;max-width:62ch}

.auth-shell{min-height:calc(100% - 20px);display:grid;place-items:center;padding:10px 0 24px}
.auth-main{
  width:min(400px,100%);
  background:#fbf7f1;
  border:1px solid var(--line);
  border-radius:8px 8px 18px 18px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.auth-head{
  padding:18px 20px 12px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#fffdf9,#f5efe7);
}
.auth-head .brandline{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;
}
.auth-head h2{font-family:var(--serif);font-size:28px;font-weight:500}
.auth-body{padding:18px 20px 20px}
.seg{
  display:grid;grid-template-columns:1fr 1fr;gap:0;
  border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px;
}
.seg button{padding:10px;font-size:13px;background:#fff;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.fld input{
  width:100%;padding:11px 12px;border-radius:6px;
  border:1px solid #d9d0c4;background:#fff;outline:none;
}
.fld input:focus{border-color:#a89880;box-shadow:0 0 0 3px rgba(168,152,128,.18)}
.auth-msg{min-height:18px;font-size:12px;color:#9a3412;margin:6px 0 10px}
.auth-msg.ok{color:#3f6b4d}
.auth-go{width:100%;padding:12px;border-radius:6px;background:var(--ink);color:#fff;font-weight:500}
.auth-go:hover{filter:brightness(1.06)}
.auth-note{margin-top:12px;font-size:11px;color:var(--muted);line-height:1.45}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:rotate(18deg) translateY(0)}50%{transform:rotate(18deg) translateY(-8px)}}
.hidden{display:none!important}
</style>
</head>
<body data-product="home">

<div id="langGate">
  <div class="lang-box">
    <h1>Choose your language</h1>
    <p>Select a language to continue. You can change this later from settings.</p>
    <input class="lang-search" id="langSearch" type="search" placeholder="Search language or country…" autocomplete="off">
    <div class="lang-list" id="langList"></div>
  </div>
</div>

<div id="app">
  <aside class="sidebar">
    <div class="brand" title="Ironpetal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3c3 4 7 5.5 7 10a7 7 0 1 1-14 0c0-4.5 4-6 7-10z"/></svg>
    </div>
    <button class="side-btn active" data-go="home" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-5v-5H10v5H5a1 1 0 0 1-1-1v-8.5z"/></svg>
      <span class="tip">Home</span>
    </button>
    <button class="side-btn" data-go="lumera" aria-label="Lumera">
      <svg viewBox="0 0 24 24" fill="none" stroke="#5b4b8a" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg>
      <span class="tip">Lumera</span>
    </button>
    <button class="side-btn" data-go="host" aria-label="Host">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2f5d8c" stroke-width="1.6"><rect x="4" y="4" width="16" height="6" rx="1.5"/><rect x="4" y="14" width="16" height="6" rx="1.5"/><circle cx="8" cy="7" r=".8" fill="#2f5d8c"/><circle cx="8" cy="17" r=".8" fill="#2f5d8c"/></svg>
      <span class="tip">Host</span>
    </button>
    <button class="side-btn" data-go="store" aria-label="Store">
      <svg viewBox="0 0 24 24" fill="none" stroke="#3d6b4f" stroke-width="1.6"><path d="M6 8h12l-1 11H7L6 8z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>
      <span class="tip">Store</span>
    </button>
    <button class="side-btn" data-go="future" aria-label="Future">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="1.6"><path d="M12 3 5 19h14L12 3z"/><path d="M12 11v5"/></svg>
      <span class="tip">Future</span>
    </button>
    <button class="side-btn" data-go="royal" aria-label="Royal">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8a6a2f" stroke-width="1.6"><path d="M4 16 6.5 8l3.5 4L12 7l2 5 3.5-4L20 16H4z"/><path d="M5 18h14"/></svg>
      <span class="tip">Royal</span>
    </button>
    <div class="side-spacer"></div>
    <button class="side-btn" data-go="auth" aria-label="Account">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="9" r="3.2"/><path d="M5.5 19c1.5-3 4-4.5 6.5-4.5S17 16 18.5 19"/></svg>
      <span class="tip">Account</span>
    </button>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="top-title" id="topTitle">Ironpetal</div>
      <div class="menu-wrap">
        <button class="icon-btn" id="menuBtn" aria-label="Settings">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="menu" id="settingsMenu">
          <button type="button" id="changeLangBtn">Change language</button>
          <button type="button" id="goAccountBtn">Account</button>
          <button type="button" id="logoutBtn" class="hidden">Sign out</button>
        </div>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<script>
const LANGS = [
  {code:"en",name:"English",region:"Global"},
  {code:"fa",name:"فارسی",region:"Iran"},
  {code:"ar",name:"العربية",region:"Middle East"},
  {code:"tr",name:"Türkçe",region:"Türkiye"},
  {code:"de",name:"Deutsch",region:"Germany"},
  {code:"fr",name:"Français",region:"France"},
  {code:"es",name:"Español",region:"Spain"},
  {code:"ru",name:"Русский",region:"Russia"},
  {code:"zh",name:"中文",region:"China"},
  {code:"ja",name:"日本語",region:"Japan"},
  {code:"hi",name:"हिन्दी",region:"India"},
  {code:"ur",name:"اردو",region:"Pakistan"},
  {code:"pt",name:"Português",region:"Brazil"},
  {code:"it",name:"Italiano",region:"Italy"},
  {code:"ko",name:"한국어",region:"Korea"},
  {code:"id",name:"Bahasa Indonesia",region:"Indonesia"},
  {code:"ku",name:"Kurdî",region:"Kurdistan"},
  {code:"az",name:"Azərbaycan",region:"Azerbaijan"}
];

const I18N = {
  en:{
    home:"Ironpetal", hero:"Crafted with intention.",
    sub:"A calm home for the Lumera suite.",
    explore:"Open suite", account:"Account",
    c1:"Purposeful design", d1:"Quiet screens. Clear hierarchy.",
    c2:"One shell", d2:"Every Lumera product opens here.",
    c3:"Soft strength", d3:"Steady, not loud.",
    signIn:"Sign in", signUp:"Create account",
    user:"Username", pass:"Password", pass2:"Confirm password",
    welcome:"Welcome", join:"Create your desk",
    needUser:"Username required", needPass:"Password required", mismatch:"Passwords do not match",
    okIn:"Signed in", okUp:"Account ready", bad:"Wrong username or password", exists:"Username taken",
    logout:"Sign out", lang:"Change language", settingsAccount:"Account",
    note:"Local desk account on this device. No server call required."
  },
  fa:{
    home:"آیرون‌پتال", hero:"با دقت ساخته شده.",
    sub:"خانه‌ای آرام برای مجموعه لومرا.",
    explore:"باز کردن مجموعه", account:"حساب کاربری",
    c1:"طراحی هدفمند", d1:"صفحه آرام و خوانا.",
    c2:"یک پوسته", d2:"همه لومراها از اینجا باز می‌شوند.",
    c3:"قدرت نرم", d3:"ثابت، نه پرهیاهو.",
    signIn:"ورود", signUp:"ثبت‌نام",
    user:"نام کاربری", pass:"رمز عبور", pass2:"تکرار رمز",
    welcome:"خوش آمدید", join:"ساخت حساب",
    needUser:"نام کاربری لازم است", needPass:"رمز لازم است", mismatch:"رمزها یکی نیستند",
    okIn:"وارد شدید", okUp:"حساب آماده است", bad:"نام کاربری یا رمز اشتباه است", exists:"این نام گرفته شده",
    logout:"خروج", lang:"تغییر زبان", settingsAccount:"حساب کاربری",
    note:"حساب روی همین دستگاه ذخیره می‌شود. نیازی به سرور نیست."
  }
};

const state = {
  lang: localStorage.getItem("ip_lang") || "",
  session: null,
  product: "home",
  authTab: "login"
};
try { const s = localStorage.getItem("ip_session"); if (s) state.session = JSON.parse(s); } catch {}

function t(k){
  const p = I18N[state.lang] || I18N.en;
  return p[k] || I18N.en[k] || k;
}
function hash(s){
  let h = 2166136261;
  for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(16);
}
function setLang(code){
  state.lang = code;
  localStorage.setItem("ip_lang", code);
  document.documentElement.lang = code;
  document.documentElement.dir = ["fa","ar","ur","he"].includes(code) ? "rtl" : "ltr";
  document.getElementById("langGate").classList.add("hidden");
  document.getElementById("app").classList.add("show");
  document.getElementById("changeLangBtn").textContent = t("lang");
  document.getElementById("goAccountBtn").textContent = t("settingsAccount");
  document.getElementById("logoutBtn").textContent = t("logout");
  document.getElementById("logoutBtn").classList.toggle("hidden", !state.session);
  render();
}
function renderLangList(filter=""){
  const q = filter.trim().toLowerCase();
  const list = document.getElementById("langList");
  list.innerHTML = "";
  LANGS.filter(l => !q || l.name.toLowerCase().includes(q) || l.region.toLowerCase().includes(q) || l.code.includes(q))
    .forEach(l => {
      const b = document.createElement("button");
      b.type="button"; b.className="lang-item";
      b.innerHTML = "<span>"+l.name+"</span><small>"+l.region+"</small>";
      b.onclick = () => setLang(l.code);
      list.appendChild(b);
    });
}
function go(product){
  state.product = product;
  document.body.dataset.product = ["lumera","host","store","future","royal"].includes(product) ? product : "home";
  document.querySelectorAll(".side-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.go === product));
  document.getElementById("settingsMenu").classList.remove("open");
  render();
}
function meta(id){
  const map = {
    home: { title: t("home") },
    lumera: { title: "Lumera", tag:"LUMERA", name:"Lumera", blurb:"Core social canvas inside the light shell.", url:"https://amir112233445566778899.github.io/LUMERA/" },
    host: { title: "Lumera Host", tag:"HOST", name:"Lumera Host", blurb:"Publish HTML pages from a clean desk.", url:"https://lumera421.github.io/Lumera_-host/" },
    store: { title: "Lumera Store", tag:"STORE", name:"Lumera Store", blurb:"Studio orders and support without noise.", url:"https://amir112233445566778899.github.io/luvex.com/" },
    future: { title: "Lumera Future", tag:"FUTURE", name:"Lumera Future", blurb:"Lab space for what comes next.", url:"" },
    royal: { title: "Lumera Royal", tag:"ROYAL", name:"Lumera Royal", blurb:"Identity across the suite.", url:"" },
    auth: { title: t("account") }
  };
  return map[id] || map.home;
}
function renderHome(){
  return '<div class="panel"><section class="hero"><div><h1>'+t("hero")+'</h1><p>'+t("sub")+'</p><div class="btn-row"><button class="btn btn-dark" data-nav="lumera">'+t("explore")+'</button><button class="btn btn-ghost" data-nav="auth">'+t("account")+'</button></div></div><div class="hero-art" aria-hidden="true"><i></i></div></section><section class="grid3"><article class="card"><h3>'+t("c1")+'</h3><p>'+t("d1")+'</p></article><article class="card"><h3>'+t("c2")+'</h3><p>'+t("d2")+'</p></article><article class="card"><h3>'+t("c3")+'</h3><p>'+t("d3")+'</p></article></section><section class="grid3"><article class="card"><h3>Lumera</h3><p>Core</p><div class="btn-row" style="margin-top:12px"><button class="btn btn-ghost" data-nav="lumera">Open</button></div></article><article class="card"><h3>Host</h3><p>Publish</p><div class="btn-row" style="margin-top:12px"><button class="btn btn-ghost" data-nav="host">Open</button></div></article><article class="card"><h3>Store</h3><p>Orders</p><div class="btn-row" style="margin-top:12px"><button class="btn btn-ghost" data-nav="store">Open</button></div></article></section></div>';
}
function renderProduct(id){
  const m = meta(id);
  const external = m.url || "";
  return '<div class="panel"><div class="product-banner"><div class="tag">'+m.tag+'</div><h2>'+m.name+'</h2><p>'+m.blurb+'</p><div class="btn-row" style="margin-top:14px">'+(external?'<a class="btn btn-dark" href="'+external+'" target="_blank" rel="noopener">Open live</a>':'')+'<button class="btn btn-ghost" data-nav="home">Ironpetal</button><button class="btn btn-ghost" data-nav="auth">'+t("account")+'</button></div></div><section class="grid3"><article class="card"><h3>Inside shell</h3><p>Stays in Ironpetal with its own accent.</p></article><article class="card"><h3>Live</h3><p>'+(external?'Use Open live for the full product.':'Preview module.')+'</p></article><article class="card"><h3>Nav</h3><p>Left icons never leave the suite.</p></article></section>'+(external?'<iframe title="'+m.name+'" src="'+external+'" style="width:100%;height:62vh;border:1px solid var(--line);border-radius:16px;background:#fff;margin-top:8px"></iframe>':'')+'</div>';
}
function renderAuth(){
  const login = state.authTab === "login";
  return '<div class="panel auth-shell"><div class="auth-main"><div class="auth-head"><div class="brandline">Ironpetal desk</div><h2>'+(login?t("welcome"):t("join"))+'</h2></div><div class="auth-body"><div class="seg"><button type="button" class="'+(login?"on":"")+'" data-tab="login">'+t("signIn")+'</button><button type="button" class="'+(!login?"on":"")+'" data-tab="register">'+t("signUp")+'</button></div><div class="fld"><label>'+t("user")+'</label><input id="authUser" maxlength="32" autocomplete="username"></div><div class="fld"><label>'+t("pass")+'</label><input id="authPass" type="password" maxlength="128" autocomplete="'+(login?"current-password":"new-password")+'"></div>'+(login?"":'<div class="fld"><label>'+t("pass2")+'</label><input id="authPass2" type="password" maxlength="128" autocomplete="new-password"></div>')+'<div class="auth-msg" id="authMsg"></div><button class="auth-go" id="authSubmit" type="button">'+(login?t("signIn"):t("signUp"))+'</button><p class="auth-note">'+t("note")+(state.session?" · @"+state.session.username:"")+'</p></div></div></div>';
}
function render(){
  const view = document.getElementById("view");
  document.getElementById("topTitle").textContent = meta(state.product).title;
  if (state.product === "home") view.innerHTML = renderHome();
  else if (state.product === "auth") view.innerHTML = renderAuth();
  else view.innerHTML = renderProduct(state.product);
  view.querySelectorAll("[data-nav]").forEach(el => el.addEventListener("click", () => go(el.getAttribute("data-nav"))));
  const tabLogin = view.querySelector('[data-tab="login"]');
  const tabReg = view.querySelector('[data-tab="register"]');
  if (tabLogin) tabLogin.onclick = () => { state.authTab="login"; render(); };
  if (tabReg) tabReg.onclick = () => { state.authTab="register"; render(); };
  const sub = view.querySelector("#authSubmit");
  if (sub) sub.onclick = submitAuth;
  document.getElementById("logoutBtn").classList.toggle("hidden", !state.session);
}
function submitAuth(){
  const msg = document.getElementById("authMsg");
  const u = (document.getElementById("authUser").value || "").trim().toLowerCase();
  const p = document.getElementById("authPass").value || "";
  if (!u) { msg.textContent = t("needUser"); return; }
  if (!p) { msg.textContent = t("needPass"); return; }
  if (state.authTab === "register") {
    const p2 = (document.getElementById("authPass2") || {}).value || "";
    if (p !== p2) { msg.textContent = t("mismatch"); return; }
  }
  let users = {};
  try { users = JSON.parse(localStorage.getItem("ip_users_v1") || "{}"); } catch {}
  const key = hash(u);
  if (state.authTab === "register") {
    if (users[key]) { msg.textContent = t("exists"); return; }
    users[key] = { u, h: hash(u + ":" + p), at: Date.now() };
    localStorage.setItem("ip_users_v1", JSON.stringify(users));
    state.session = { username: u };
    localStorage.setItem("ip_session", JSON.stringify(state.session));
    msg.className = "auth-msg ok";
    msg.textContent = t("okUp");
  } else {
    const row = users[key];
    if (!row || row.h !== hash(u + ":" + p)) { msg.textContent = t("bad"); return; }
    state.session = { username: u };
    localStorage.setItem("ip_session", JSON.stringify(state.session));
    msg.className = "auth-msg ok";
    msg.textContent = t("okIn");
  }
  document.getElementById("logoutBtn").classList.remove("hidden");
}

document.getElementById("langSearch").addEventListener("input", e => renderLangList(e.target.value));
document.querySelectorAll(".side-btn").forEach(btn => btn.addEventListener("click", () => go(btn.dataset.go)));
document.getElementById("menuBtn").addEventListener("click", e => {
  e.stopPropagation();
  document.getElementById("settingsMenu").classList.toggle("open");
});
document.addEventListener("click", e => {
  if (!e.target.closest(".menu-wrap")) document.getElementById("settingsMenu").classList.remove("open");
});
document.getElementById("changeLangBtn").addEventListener("click", () => {
  document.getElementById("settingsMenu").classList.remove("open");
  document.getElementById("app").classList.remove("show");
  document.getElementById("langGate").classList.remove("hidden");
  renderLangList();
});
document.getElementById("goAccountBtn").addEventListener("click", () => go("auth"));
document.getElementById("logoutBtn").addEventListener("click", () => {
  state.session = null;
  localStorage.removeItem("ip_session");
  go("auth");
});

renderLangList();
if (state.lang) setLang(state.lang);
</script>
</body>
</html>
