<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="index,follow">
<title>Ironpetal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 4c4 6 10 8 10 14a10 10 0 1 1-20 0c0-6 6-8 10-14z' fill='%233f3a36'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1714;--muted:#6f675f;--line:rgba(26,23,20,.1);--soft:#e8dfd3;
  --paper:rgba(251,247,241,.88);--sidebar:78px;
  --font:"IBM Plex Sans",system-ui,sans-serif;--serif:"Cormorant Garamond",Georgia,serif;
  --shadow:0 18px 48px rgba(40,30,20,.08);--accent:#3a342e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--ink);overflow:hidden;
  background:#efe6db url("bg.png") center/cover no-repeat fixed;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}

#langGate{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(239,230,219,.92);backdrop-filter:blur(8px)}
#langGate.hidden{display:none}
.lang-box{width:min(540px,100%);background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:28px 22px 20px;animation:rise .4s ease}
.lang-box h1{font-family:var(--serif);font-size:clamp(28px,4vw,40px);font-weight:500;margin-bottom:8px}
.lang-box p{color:var(--muted);font-size:14px;margin-bottom:16px}
.lang-search{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:12px;outline:none}
.lang-list{max-height:300px;overflow:auto;display:grid;gap:4px}
.lang-item{text-align:start;padding:10px 12px;border-radius:10px;display:flex;justify-content:space-between;gap:8px}
.lang-item:hover{background:rgba(26,23,20,.05)}
.lang-item small{color:var(--muted)}

#app{position:relative;z-index:1;display:none;height:100%}
#app.show{display:flex;animation:fade .3s ease}
.sidebar{width:var(--sidebar);flex-shrink:0;height:100%;border-inline-end:1px solid var(--line);background:rgba(251,247,241,.82);backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;z-index:5}
.brand{width:40px;height:40px;border-radius:13px;margin-bottom:6px;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
.side-btn{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;position:relative;transition:.18s}
.side-btn svg{width:21px;height:21px}
.side-btn:hover{background:rgba(26,23,20,.05)}
.side-btn.active{background:#fff;border:1px solid var(--line);box-shadow:0 8px 20px rgba(40,30,20,.06)}
.side-btn .tip{position:absolute;inset-inline-start:54px;top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;font-size:11px;padding:5px 8px;border-radius:7px;opacity:0;pointer-events:none;white-space:nowrap;z-index:40}
.side-btn:hover .tip{opacity:1}
.side-spacer{flex:1}

.main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:58px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(251,247,241,.75);backdrop-filter:blur(12px);position:relative;z-index:50}
.top-title{font-family:var(--serif);font-size:21px;font-weight:500}
.menu-wrap{position:relative;z-index:60}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;display:grid;place-items:center}
.menu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;width:220px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:none;z-index:70}
.menu.open{display:block;animation:pop .16s ease}
.menu button{width:100%;text-align:start;padding:10px 11px;border-radius:9px;font-size:13px}
.menu button:hover{background:rgba(26,23,20,.05)}

.content{flex:1;overflow:auto;padding:20px 18px 32px;position:relative;z-index:1}
.panel{animation:rise .35s ease}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:center;margin-bottom:18px}
@media(max-width:900px){.hero{grid-template-columns:1fr}}
.hero h1{font-family:var(--serif);font-size:clamp(32px,5vw,50px);line-height:1.05;margin-bottom:10px}
.hero p{color:var(--muted);line-height:1.55;margin-bottom:14px;max-width:46ch}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 15px;border-radius:999px;font-size:13px;font-weight:500}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:#fff;border:1px solid var(--line)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.hero-art{min-height:200px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(145deg,#fffaf4,rgba(232,214,196,.55));position:relative;overflow:hidden}
.hero-art i{position:absolute;width:110px;height:150px;right:12%;top:14%;border:1.5px solid rgba(160,120,90,.35);border-radius:50% 50% 45% 45%;transform:rotate(18deg);animation:float 6s ease-in-out infinite}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
@media(max-width:800px){.grid3{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;transition:.2s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card h3{font-family:var(--serif);font-size:20px;font-weight:500;margin:6px 0}
.card p{color:var(--muted);font-size:13px;line-height:1.5}

body[data-product="lumera"]{--accent:#5b4b8a;--soft:#ebe6f5}
body[data-product="host"]{--accent:#2f5d8c;--soft:#e6eef6}
body[data-product="store"]{--accent:#3d6b4f;--soft:#e7f0ea}
body[data-product="future"]{--accent:#0f766e;--soft:#e6f4f2}
body[data-product="royal"]{--accent:#8a6a2f;--soft:#f3ecd9}

.banner{border:1px solid var(--line);border-radius:20px;padding:18px;background:linear-gradient(120deg,#fffaf4,var(--soft,#e8dfd3));margin-bottom:14px}
.banner .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px}
.banner h2{font-family:var(--serif);font-size:30px;font-weight:500;margin-bottom:6px}
.banner p{color:var(--muted);line-height:1.5}

.mod{border:1px solid var(--line);border-radius:16px;background:var(--paper);padding:14px;margin-bottom:12px}
.mod h4{font-family:var(--serif);font-size:18px;margin-bottom:8px}
.feed{display:grid;gap:10px}
.feed-item{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.feed-item .who{font-weight:600;font-size:13px;margin-bottom:4px}
.feed-item .txt{font-size:13px;color:var(--muted);line-height:1.45}
.composer{display:flex;gap:8px;margin-top:10px}
.composer input,.composer textarea,.field input,.field textarea{width:100%;border:1px solid #d9d0c4;border-radius:8px;padding:10px 12px;background:#fff;outline:none}
.composer button,.act{padding:10px 14px;border-radius:8px;background:var(--ink);color:#fff;font-size:13px}
.list{display:grid;gap:8px}
.list button{text-align:start;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff}
.list button:hover{background:var(--soft)}

.auth-shell,.prof-shell{max-width:440px;margin:0 auto}
.box{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.box-h{padding:16px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fffdf9,#f5efe7)}
.box-h .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.box-h h2{font-family:var(--serif);font-size:26px;font-weight:500}
.box-b{padding:16px 18px 18px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
.seg button{padding:10px;font-size:13px;background:#fff;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.field{margin-bottom:11px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.msg{min-height:16px;font-size:12px;color:#9a3412;margin:4px 0 8px}
.msg.ok{color:#3f6b4d}
.note{font-size:11px;color:var(--muted);margin-top:10px;line-height:1.4}
.avatar-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--serif);font-size:22px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:rotate(18deg) translateY(0)}50%{transform:rotate(18deg) translateY(-8px)}}
</style>
</head>

  <div class="main">

        <div class="menu" id="settingsMenu">
          <button type="button" id="changeLangBtn">Language</button>
          <button type="button" id="goProfileBtn">Profile</button>
          <button type="button" id="goAuthBtn">Account</button>
          <button type="button" id="logoutBtn" class="hidden">Sign out</button>

    <main class="content" id="view"></main>
  </div>
</div>

const state={lang:localStorage.getItem("ip_lang")||"",session:null,product:"home",authTab:"login"};
try{const s=localStorage.getItem("ip_session");if(s)state.session=JSON.parse(s);}catch{}

function t(k){const p=PACK[state.lang]||EN;return p[k]||EN[k]||k;}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return(h>>>0).toString(16);}
function needUser(){return!!state.session;}

function setLang(code){
  state.lang=code;localStorage.setItem("ip_lang",code);
  document.documentElement.lang=code;
  document.documentElement.dir=RTL.has(code)?"rtl":"ltr";
  document.getElementById("langGate").classList.add("hidden");
  document.getElementById("app").classList.add("show");
  document.getElementById("changeLangBtn").textContent=t("lang");
  document.getElementById("goProfileBtn").textContent=t("profile");
  document.getElementById("goAuthBtn").textContent=t("account");
  document.getElementById("logoutBtn").textContent=t("logout");
  document.getElementById("logoutBtn").classList.toggle("hidden",!state.session);
  render();
}
function renderLangList(filter=""){
  const q=filter.trim().toLowerCase();
  const list=document.getElementById("langList");list.innerHTML="";
  document.getElementById("langTitle").textContent=(PACK[state.lang]||EN).langTitle||EN.langTitle;
  document.getElementById("langSub").textContent=(PACK[state.lang]||EN).langSub||EN.langSub;
  LANGS.filter(l=>!q||l.name.toLowerCase().includes(q)||l.region.toLowerCase().includes(q)||l.code.includes(q)).forEach(l=>{
    const b=document.createElement("button");b.type="button";b.className="lang-item";
    b.innerHTML="<span>"+l.name+"</span><small>"+l.region+"</small>";
    b.onclick=()=>setLang(l.code);list.appendChild(b);
  });
}
function go(p){state.product=p;document.body.dataset.product=["lumera","host","store","future","royal"].includes(p)?p:"home";
  document.querySelectorAll(".side-btn").forEach(b=>b.classList.toggle("active",b.dataset.go===p));
  document.getElementById("settingsMenu").classList.remove("open");render();}

function storeGet(key,def){try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(def));}catch{return def;}}
function storeSet(key,val){localStorage.setItem(key,JSON.stringify(val));}
function profileKey(){return state.session?"ip_prof_"+state.session.username:"ip_prof_guest";}
function feedKey(){return "ip_feed_v1";}
function pagesKey(){return state.session?"ip_pages_"+state.session.username:"ip_pages_guest";}
function ordersKey(){return state.session?"ip_orders_"+state.session.username:"ip_orders_guest";}

function renderHome(){
  return `<div class="panel"><section class="hero"><div><h1>${t("hero")}</h1><p>${t("sub")}</p><div class="btn-row"><button class="btn btn-dark" data-nav="lumera">${t("explore")}</button><button class="btn btn-ghost" data-nav="profile">${t("profile")}</button></div></div><div class="hero-art"><i></i></div></section>
  <section class="grid3"><article class="card"><h3>${t("c1")}</h3><p>${t("d1")}</p></article><article class="card"><h3>${t("c2")}</h3><p>${t("d2")}</p></article><article class="card"><h3>${t("c3")}</h3><p>${t("d3")}</p></article></section>
  <section class="grid3"><article class="card"><h3>Lumera</h3><p>Feed</p><div class="btn-row" style="margin-top:10px"><button class="btn btn-ghost" data-nav="lumera">Open</button></div></article>
  <article class="card"><h3>Host</h3><p>Pages</p><div class="btn-row" style="margin-top:10px"><button class="btn btn-ghost" data-nav="host">Open</button></div></article>
  <article class="card"><h3>Store</h3><p>Orders</p><div class="btn-row" style="margin-top:10px"><button class="btn btn-ghost" data-nav="store">Open</button></div></article></section></div>`;
}
function gate(){return `<div class="banner"><div class="tag">IRONPETAL</div><h2>${t("needAuth")}</h2><p>${t("sub")}</p><div class="btn-row" style="margin-top:12px"><button class="btn btn-dark" data-nav="auth">${t("signIn")}</button></div></div>`;}

function renderLumera(){
  if(!needUser())return `<div class="panel">${gate()}</div>`;
  const feed=storeGet(feedKey(),[]);
  const items=feed.slice().reverse().map(p=>`<div class="feed-item"><div class="who">@${p.user}</div><div class="txt">${escapeHtml(p.text)}</div></div>`).join("")||`<p class="note">${t("emptyFeed")}</p>`;
  return `<div class="panel"><div class="banner"><div class="tag">LUMERA</div><h2>Lumera</h2><p>${t("d2")}</p></div>
  <div class="mod"><h4>${t("posts")}</h4><div class="feed">${items}</div>
  <div class="composer"><input id="postText" maxlength="280" placeholder="${t("newPost")}"><button class="act" id="postBtn">${t("publish")}</button></div></div></div>`;
}
function renderHost(){
  if(!needUser())return `<div class="panel">${gate()}</div>`;
  const pages=storeGet(pagesKey(),[]);
  const last=pages[pages.length-1];
  return `<div class="panel"><div class="banner"><div class="tag">HOST</div><h2>Lumera Host</h2><p>${t("hostHint")}</p></div>
  <div class="mod"><h4>${t("hostTitle")}</h4>
  <div class="field"><label>HTML</label><textarea id="hostCode" rows="8" placeholder="&lt;h1&gt;Hello&lt;/h1&gt;">${last?escapeHtml(last.code):""}</textarea></div>
  <div class="btn-row"><button class="btn btn-dark" id="hostSave">${t("hostSave")}</button><button class="btn btn-ghost" id="hostPrev">${t("hostOpen")}</button></div>
  <div id="hostPreview" style="margin-top:12px;border:1px solid var(--line);border-radius:12px;min-height:120px;background:#fff;padding:12px"></div>
  </div></div>`;
}
function renderStore(){
  if(!needUser())return `<div class="panel">${gate()}</div>`;
  const orders=storeGet(ordersKey(),[]);
  const list=orders.slice().reverse().map(o=>`<div class="feed-item"><div class="who">${escapeHtml(o.type)}</div><div class="txt">${escapeHtml(o.note)}</div></div>`).join("")||`<p class="note">—</p>`;
  return `<div class="panel"><div class="banner"><div class="tag">STORE</div><h2>Lumera Store</h2><p>${t("storeHint")}</p></div>
  <div class="mod"><h4>${t("storeTitle")}</h4>
  <div class="field"><label>Type</label><input id="ordType" placeholder="site / bot"></div>
  <div class="field"><label>Note</label><textarea id="ordNote" rows="3"></textarea></div>
  <button class="btn btn-dark" id="ordSend">${t("storeSend")}</button>
  <div class="feed" style="margin-top:12px">${list}</div></div></div>`;
}
function renderFuture(){
  return `<div class="panel"><div class="banner"><div class="tag">FUTURE</div><h2>Lumera Future</h2><p>${t("futureHint")}</p></div>
  <section class="grid3"><article class="card"><h3>Motion</h3><p>Soft transitions across the suite.</p></article>
  <article class="card"><h3>Desk sync</h3><p>One Ironpetal account for every module.</p></article>
  <article class="card"><h3>Quiet AI</h3><p>Helpers that stay optional.</p></article></section></div>`;
}
function renderRoyal(){
  if(!needUser())return `<div class="panel">${gate()}</div>`;
  const prof=storeGet(profileKey(),{});
  const feed=storeGet(feedKey(),[]).filter(p=>p.user===state.session.username);
  const pages=storeGet(pagesKey(),[]);
  const tasks=[{id:"p",label:t("task1"),ok:!!(prof.display||prof.bio)},{id:"l",label:t("task2"),ok:feed.length>0},{id:"h",label:t("task3"),ok:pages.length>0}];
  return `<div class="panel"><div class="banner"><div class="tag">ROYAL</div><h2>Lumera Royal</h2><p>${t("royalHint")}</p></div>
  <div class="mod"><h4>${t("royalTitle")}</h4><div class="list">${tasks.map(x=>`<button type="button"><strong>${x.label}</strong> — ${x.ok?t("done"):t("todo")}</button>`).join("")}</div></div></div>`;
}
function renderAuth(){
  const login=state.authTab==="login";
  return `<div class="panel"><div class="auth-shell"><div class="box"><div class="box-h"><div class="eyebrow">Ironpetal</div><h2>${login?t("welcome"):t("join")}</h2></div><div class="box-b">
  <div class="seg"><button type="button" class="${login?"on":""}" data-tab="login">${t("signIn")}</button><button type="button" class="${!login?"on":""}" data-tab="register">${t("signUp")}</button></div>
  <div class="field"><label>${t("user")}</label><input id="authUser" maxlength="32"></div>
  <div class="field"><label>${t("pass")}</label><input id="authPass" type="password" maxlength="128"></div>
  ${login?"":`<div class="field"><label>${t("pass2")}</label><input id="authPass2" type="password" maxlength="128"></div>`}
  <div class="msg" id="authMsg"></div>
  <button class="btn btn-dark" style="width:100%;justify-content:center" id="authSubmit">${login?t("signIn"):t("signUp")}</button>
  </div></div></div></div>`;
}
function renderProfile(){
  if(!needUser())return `<div class="panel">${gate()}</div>`;
  const p=storeGet(profileKey(),{display:"",bio:"",avatar:""});
  const initial=(state.session.username||"?").slice(0,1).toUpperCase();
  return `<div class="panel"><div class="prof-shell"><div class="box"><div class="box-h"><div class="eyebrow">@${state.session.username}</div><h2>${t("profile")}</h2></div><div class="box-b">
  <div class="avatar-row"><div class="avatar" id="avPrev">${p.avatar?`<img src="${escapeAttr(p.avatar)}" alt="">`:initial}</div><div><strong>${p.display||state.session.username}</strong><div class="note">${t("bio")}</div></div></div>
  <div class="field"><label>${t("display")}</label><input id="pfDisplay" value="${escapeAttr(p.display||"")}" maxlength="40"></div>
  <div class="field"><label>${t("bio")}</label><textarea id="pfBio" rows="4" maxlength="240">${escapeHtml(p.bio||"")}</textarea></div>
  <div class="field"><label>${t("avatar")}</label><input id="pfAvatar" value="${escapeAttr(p.avatar||"")}" placeholder="https://..."></div>
  <div class="msg" id="pfMsg"></div>
  <button class="btn btn-dark" id="pfSave">${t("save")}</button>
  </div></div></div></div>`;
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function escapeAttr(s){return escapeHtml(s).replace(/\n/g," ");}

function titleOf(p){
  return ({home:t("home"),lumera:"Lumera",host:"Lumera Host",store:"Lumera Store",future:"Lumera Future",royal:"Lumera Royal",auth:t("account"),profile:t("profile")})[p]||t("home");
}
function render(){
  const view=document.getElementById("view");
  document.getElementById("topTitle").textContent=titleOf(state.product);
  const map={home:renderHome,lumera:renderLumera,host:renderHost,store:renderStore,future:renderFuture,royal:renderRoyal,auth:renderAuth,profile:renderProfile};
  view.innerHTML=(map[state.product]||renderHome)();
  view.querySelectorAll("[data-nav]").forEach(el=>el.addEventListener("click",()=>go(el.getAttribute("data-nav"))));
  bindModule();
  document.getElementById("logoutBtn").classList.toggle("hidden",!state.session);
}
function bindModule(){
  const postBtn=document.getElementById("postBtn");
  if(postBtn)postBtn.onclick=()=>{
    const text=(document.getElementById("postText").value||"").trim();if(!text)return;
    const feed=storeGet(feedKey(),[]);feed.push({user:state.session.username,text,at:Date.now()});storeSet(feedKey(),feed);render();
  };
  const hostSave=document.getElementById("hostSave");
  if(hostSave)hostSave.onclick=()=>{
    const code=document.getElementById("hostCode").value||"";
    const pages=storeGet(pagesKey(),[]);pages.push({code,at:Date.now()});storeSet(pagesKey(),pages);
    document.getElementById("hostPreview").innerHTML=code;
  };
  const hostPrev=document.getElementById("hostPrev");
  if(hostPrev)hostPrev.onclick=()=>{document.getElementById("hostPreview").innerHTML=document.getElementById("hostCode").value||"";};
  const ordSend=document.getElementById("ordSend");
  if(ordSend)ordSend.onclick=()=>{
    const type=(document.getElementById("ordType").value||"").trim()||"request";
    const note=(document.getElementById("ordNote").value||"").trim();
    const orders=storeGet(ordersKey(),[]);orders.push({type,note,at:Date.now()});storeSet(ordersKey(),orders);render();
  };
  const tabL=document.querySelector('[data-tab="login"]');const tabR=document.querySelector('[data-tab="register"]');
  if(tabL)tabL.onclick=()=>{state.authTab="login";render();};
  if(tabR)tabR.onclick=()=>{state.authTab="register";render();};
  const authSubmit=document.getElementById("authSubmit");
  if(authSubmit)authSubmit.onclick=submitAuth;
  const pfSave=document.getElementById("pfSave");
  if(pfSave)pfSave.onclick=()=>{
    const display=(document.getElementById("pfDisplay").value||"").trim();
    const bio=(document.getElementById("pfBio").value||"").trim();
    const avatar=(document.getElementById("pfAvatar").value||"").trim();
    storeSet(profileKey(),{display,bio,avatar});
    const m=document.getElementById("pfMsg");m.className="msg ok";m.textContent=t("saved");
  };
}
function submitAuth(){
  const msg=document.getElementById("authMsg");
  const u=(document.getElementById("authUser").value||"").trim().toLowerCase();
  const p=document.getElementById("authPass").value||"";
  if(!u){msg.textContent=t("needUser");return;}
  if(!p){msg.textContent=t("needPass");return;}
  if(state.authTab==="register"){const p2=(document.getElementById("authPass2")||{}).value||"";if(p!==p2){msg.textContent=t("mismatch");return;}}
  let users={};try{users=JSON.parse(localStorage.getItem("ip_users_v1")||"{}");}catch{}
  const key=hash(u);
  if(state.authTab==="register"){
    if(users[key]){msg.textContent=t("exists");return;}
    users[key]={u,h:hash(u+":"+p),at:Date.now()};localStorage.setItem("ip_users_v1",JSON.stringify(users));
    state.session={username:u};localStorage.setItem("ip_session",JSON.stringify(state.session));
    msg.className="msg ok";msg.textContent=t("okUp");
  }else{
    const row=users[key];if(!row||row.h!==hash(u+":"+p)){msg.textContent=t("bad");return;}
    state.session={username:u};localStorage.setItem("ip_session",JSON.stringify(state.session));
    msg.className="msg ok";msg.textContent=t("okIn");
  }
  document.getElementById("logoutBtn").classList.remove("hidden");
}

document.getElementById("langSearch").addEventListener("input",e=>renderLangList(e.target.value));
document.querySelectorAll(".side-btn").forEach(btn=>btn.addEventListener("click",()=>go(btn.dataset.go)));
document.getElementById("menuBtn").addEventListener("click",e=>{e.stopPropagation();document.getElementById("settingsMenu").classList.toggle("open");});
document.addEventListener("click",e=>{if(!e.target.closest(".menu-wrap"))document.getElementById("settingsMenu").classList.remove("open");});
document.getElementById("changeLangBtn").addEventListener("click",()=>{document.getElementById("settingsMenu").classList.remove("open");document.getElementById("app").classList.remove("show");document.getElementById("langGate").classList.remove("hidden");renderLangList();});
document.getElementById("goProfileBtn").addEventListener("click",()=>go("profile"));
document.getElementById("goAuthBtn").addEventListener("click",()=>go("auth"));
document.getElementById("logoutBtn").addEventListener("click",()=>{state.session=null;localStorage.removeItem("ip_session");go("auth");});
renderLangList();
if(state.lang)setLang(state.lang);
</script>
</body>
</html>
