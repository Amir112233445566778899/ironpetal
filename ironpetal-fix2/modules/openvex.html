<script>
(function(){
  var map={zh:"zh-CN",he:"iw"};
  function code(l){l=(l||"en").toLowerCase();return map[l]||l;}
  function lang(){try{return localStorage.getItem("ip_lang")||"en";}catch(e){return "en";}}
  // cookie early = faster translate
  try{
    var c=code(lang());
    document.cookie="googtrans=/auto/"+c+";path=/";
    document.cookie="googtrans=/auto/"+c+";path=/;domain="+location.hostname;
  }catch(e){}
  window.ipForceTranslate=window.ipForceTranslate||function(l){
    try{localStorage.setItem("ip_lang",l);}catch(e){}
    var c=code(l);
    document.cookie="googtrans=/auto/"+c+";path=/";
    var sel=document.querySelector("select.goog-te-combo");
    if(sel){sel.value=c;sel.dispatchEvent(new Event("change"));}
  };
})();
</script>

    <meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://translate.google.com https://translate.googleapis.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com; font-src https://fonts.gstatic.com data:; img-src * data: blob:; connect-src https: wss:; frame-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>OpenVex</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&amp;display=swap">
    <style>
        :root {
            --bg: #000;
            --field: #0f1012;
            --line: #2b2e33;
            --text: #f2f3f4;
            --muted: #7c828a;
            --white: #fff;
            --danger: #f4212e;
            --ease: cubic-bezier(.22, 1, .36, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Vazirmatn, "IRANSans", Tahoma, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        html[lang="en"] * {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        /* ================= Language (small, flat) ================= */
        .lang {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0px) + 12px);
            inset-inline-end: 14px;
            z-index: 30;
        }
        .lang-btn {
            height: 38px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            gap: 7px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: transparent;
            color: var(--text);
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s, border-color .2s;
        }
        .lang-btn:active { background: rgba(255,255,255,0.08); }
        @media (hover: hover) { .lang-btn:hover { border-color: #4a4e54; } }
        .lang-btn:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
        .lang-btn svg { width: 17px; height: 17px; }

        .lang-menu {
            position: absolute;
            top: 46px;
            inset-inline-end: 0;
            min-width: 160px;
            padding: 5px;
            background: #111214;
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: 0 12px 28px rgba(0,0,0,0.6);
            opacity: 0;
            transform: translateY(-6px) scale(.97);
            transform-origin: top;
            pointer-events: none;
            transition: opacity .18s ease, transform .22s var(--ease);
        }
        .lang.open .lang-menu { opacity: 1; transform: none; pointer-events: auto; }
        .lang-item {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: none;
            border-radius: 11px;
            background: transparent;
            color: var(--text);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            text-align: start;
        }
        .lang-item:active { background: rgba(255,255,255,0.1); }
        @media (hover: hover) { .lang-item:hover { background: rgba(255,255,255,0.06); } }
        .lang-item:focus-visible { outline: 2px solid var(--white); }
        .lang-item .tick { width: 17px; height: 17px; opacity: 0; }
        .lang-item[aria-checked="true"] { font-weight: 800; color: var(--white); }
        .lang-item[aria-checked="true"] .tick { opacity: 1; }

        /* ================= Screen 1: Welcome ================= */
        .welcome {
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top, 0px) 18px calc(env(safe-area-inset-bottom, 0px) + 26px);
            transition: transform .45s var(--ease), opacity .45s var(--ease);
        }
        .welcome.away { transform: scale(.95); opacity: .3; }

        .welcome-center {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-wrap {
            width: 104px;
            height: 104px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: logo-in .8s var(--ease) both;
        }
        .logo-wrap img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .logo-fallback {
            display: none;
            font-size: 36px;
            font-weight: 800;
            color: var(--white);
            direction: ltr;
        }
        .logo-wrap.no-img img { display: none; }
        .logo-wrap.no-img .logo-fallback { display: block; }

        .welcome-bottom {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            animation: rise-in .7s var(--ease) .3s both;
        }

        .register-line {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            margin-top: 20px;
            animation: fade-in .6s ease .75s both;
        }
        .register-line a { color: var(--white); text-decoration: none; font-weight: 700; }
        .register-line a:active { opacity: .6; }

        /* ================= Buttons (flat white) ================= */
        .btn {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 14px;
            background: var(--white);
            color: #000;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform .15s var(--ease), background .2s;
        }
        @media (hover: hover) { .btn:hover { background: #e8eaeb; } }
        .btn:active { transform: scale(.975); }
        .btn:disabled { cursor: default; }
        .btn:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(0,0,0,0.18);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }
        .check { width: 22px; height: 22px; }
        .check path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw .35s ease forwards; }

        /* ================= Screen 2: Full-screen login ================= */
        .login-screen {
            position: fixed;
            inset: 0;
            z-index: 10;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            transform: translateX(-100%);
            visibility: hidden;
            transition: transform .4s var(--ease), visibility 0s linear .4s;
        }
        html[dir="ltr"] .login-screen { transform: translateX(100%); }
        .login-screen.open {
            transform: translateX(0) !important;
            visibility: visible;
            transition: transform .4s var(--ease);
        }

        .topbar {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 8px;
            flex-shrink: 0;
        }
        .back {
            width: 44px;
            height: 44px;
            border: none;
            background: transparent;
            color: var(--white);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s, transform .15s var(--ease);
        }
        .back:active { background: rgba(255,255,255,0.12); transform: scale(.9); }
        .back svg { width: 24px; height: 24px; }
        html[dir="ltr"] .back svg { transform: scaleX(-1); }
        .back:focus-visible { outline: 2px solid var(--white); }

        .login-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px 18px 24px;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        .reveal { opacity: 0; transform: translateY(14px); }
        .login-screen.open .reveal {
            opacity: 1;
            transform: none;
            transition: opacity .5s var(--ease), transform .5s var(--ease);
            transition-delay: calc(var(--i, 0) * 70ms + 150ms);
        }

        .login-body h1 { font-size: 30px; font-weight: 800; color: var(--white); margin-bottom: 8px; }
        .login-body .hint { font-size: 14.5px; color: var(--muted); line-height: 1.7; margin-bottom: 30px; }

        /* floating-label fields */
        .field { position: relative; margin-bottom: 14px; }

        .field input {
            width: 100%;
            height: 60px;
            padding: 22px 18px 6px;
            border-radius: 14px;
            border: 1.5px solid var(--line);
            background: var(--field);
            color: var(--white);
            font-size: 16px;
            outline: none;
            transition: border-color .2s;
        }
        .field input::placeholder { color: transparent; }
        .field input:focus { border-color: var(--white); }
        .field.has-toggle input { padding-inline-end: 54px; }
        .field.invalid input { border-color: var(--danger); }
        .field.shake { animation: shake .4s ease; }

        .field label {
            position: absolute;
            inset-inline-start: 19px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 16px;
            pointer-events: none;
            transition: top .18s var(--ease), font-size .18s var(--ease), color .18s;
            max-width: calc(100% - 70px);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .field input:focus + label,
        .field input:not(:placeholder-shown) + label {
            top: 17px;
            font-size: 12px;
        }
        .field input:focus + label { color: var(--white); }
        .field.invalid input + label { color: var(--danger); }

        .toggle-pass {
            position: absolute;
            inset-inline-end: 8px;
            top: 8px;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color .2s, transform .15s var(--ease);
        }
        .toggle-pass:active { transform: scale(.85); color: var(--white); }
        .toggle-pass svg { width: 22px; height: 22px; }
        .toggle-pass .eye-off { display: none; }
        .toggle-pass.showing .eye { display: none; }
        .toggle-pass.showing .eye-off { display: block; }
        .toggle-pass:focus-visible { outline: 2px solid var(--white); }

        .caps-hint {
            font-size: 13px;
            color: var(--muted);
            height: 0;
            opacity: 0;
            overflow: hidden;
            transition: height .25s var(--ease), opacity .25s, margin .25s;
        }
        .caps-hint.show { height: 22px; opacity: 1; margin-bottom: 4px; }

        .error-msg {
            color: #ff7a83;
            font-size: 14px;
            line-height: 1.6;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height .3s var(--ease), opacity .3s, margin .3s;
        }
        .error-msg.show { max-height: 80px; opacity: 1; margin: 4px 0 14px; }

        .login-body .btn { margin-top: 10px; }

        /* ================= Motion ================= */
        @keyframes logo-in { from { opacity: 0; transform: scale(.75); } to { opacity: 1; transform: scale(1); } }
        @keyframes rise-in { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes draw { to { stroke-dashoffset: 0; } }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-7px); }
            40% { transform: translateX(7px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
        }
    </style>
</head>

                errFail: 'Ошибка входа.', errServer: 'Ошибка сервера.'
            },

        };

        const LANG_KEY = 'openvex_lang';
        let currentLang = 'en';
        function t(key) { return I18N[currentLang][key]; }

        function pickInitialLang() {
            try {
                const saved = localStorage.getItem(LANG_KEY) || localStorage.getItem('ip_lang');
                if (saved && I18N[saved]) return saved;
            } catch (e) {}
            const nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
            return I18N[nav] ? nav : 'en';
        }

        /* ---------- Elements ---------- */
        const welcome = document.getElementById('welcome');
        const loginScreen = document.getElementById('loginScreen');
        const usernameInput = document.getElementById('username');
        const passInput = document.getElementById('password');
        const userField = document.getElementById('userField');
        const passField = document.getElementById('passField');
        const toggleBtn = document.getElementById('togglePass');
        const errorMsg = document.getElementById('errorMsg');
        const capsHint = document.getElementById('capsHint');
        const loginBtn = document.getElementById('loginBtn');
        const logoWrap = document.getElementById('logoWrap');
        const logoImg = document.getElementById('logoImg');
        const langBox = document.getElementById('lang');
        const langBtn = document.getElementById('langBtn');

        function applyLang(lang, save) {
            if (!I18N[lang]) lang = 'en';
            currentLang = lang;
            const d = I18N[lang];

            document.documentElement.lang = lang;
            document.documentElement.dir = d.dir;

            document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll('[data-i18n-aria]').forEach(function (el) { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });

            toggleBtn.setAttribute('aria-label', toggleBtn.classList.contains('showing') ? t('hidePass') : t('showPass'));
            document.getElementById('langLabel').textContent = d.name;
            document.querySelectorAll('.lang-item').forEach(function (it) {
                it.setAttribute('aria-checked', it.dataset.lang === lang ? 'true' : 'false');
            });

            if (errorMsg.classList.contains('show') && errorMsg.dataset.key) errorMsg.textContent = t(errorMsg.dataset.key);
            if (!loginBtn.disabled) loginBtn.textContent = t('login');

            if (save) { try { localStorage.setItem(LANG_KEY, lang); } catch (e) {} }
        }

        function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }

        /* ---------- Language menu ---------- */
        function setMenu(open) {
            langBox.classList.toggle('open', open);
            langBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
        }
        langBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            setMenu(!langBox.classList.contains('open'));
        });
        document.querySelectorAll('.lang-item').forEach(function (it) {
            it.addEventListener('click', function () {
                applyLang(it.dataset.lang, true);
                setMenu(false);
            });
        });
        document.addEventListener('click', function (e) { if (!langBox.contains(e.target)) setMenu(false); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setMenu(false); });

        /* ---------- Logo fallback ---------- */
        function logoFailed() { logoWrap.classList.add('no-img'); }
        logoImg.addEventListener('error', logoFailed);
        if (logoImg.complete && logoImg.naturalWidth === 0) logoFailed();

        /* ---------- Screens ---------- */
        function openLogin() {
            buzz(8);
            setMenu(false);
            welcome.classList.add('away');
            loginScreen.classList.add('open');
            loginScreen.setAttribute('aria-hidden', 'false');
            history.pushState({ login: true }, '');
            setTimeout(function () { usernameInput.focus(); }, 450);
        }
        function closeLogin() {
            welcome.classList.remove('away');
            loginScreen.classList.remove('open');
            loginScreen.setAttribute('aria-hidden', 'true');
            document.activeElement && document.activeElement.blur();
        }

        document.getElementById('startBtn').addEventListener('click', openLogin);
        document.getElementById('backBtn').addEventListener('click', function () {
            if (history.state && history.state.login) history.back(); else closeLogin();
        });
        window.addEventListener('popstate', closeLogin);

        /* ---------- Form behaviour ---------- */
        toggleBtn.addEventListener('click', function () {
            const show = passInput.type === 'password';
            passInput.type = show ? 'text' : 'password';
            toggleBtn.classList.toggle('showing', show);
            toggleBtn.setAttribute('aria-label', show ? t('hidePass') : t('showPass'));
            passInput.focus();
        });

        usernameInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); passInput.focus(); }
        });

        [usernameInput, passInput].forEach(function (inp) {
            inp.addEventListener('input', function () {
                inp.parentElement.classList.remove('invalid');
                hideError();
            });
        });

        function caps(e) {
            if (e.getModifierState) capsHint.classList.toggle('show', e.getModifierState('CapsLock'));
        }
        passInput.addEventListener('keydown', caps);
        passInput.addEventListener('keyup', caps);
        passInput.addEventListener('blur', function () { capsHint.classList.remove('show'); });

        function hideError() { errorMsg.classList.remove('show'); }

        function shake(field) {
            field.classList.remove('shake');
            void field.offsetWidth;
            field.classList.add('shake');
        }

        function setLoading() {
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span><span>' + t('loggingIn') + '</span>';
        }
        function setIdle() {
            loginBtn.disabled = false;
            loginBtn.textContent = t('login');
        }
        function setSuccess() {
            loginBtn.innerHTML = '<svg class="check" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
        }

        function showError(key, fields, serverText) {
            errorMsg.dataset.key = serverText ? '' : key;
            errorMsg.textContent = serverText || t(key);
            errorMsg.classList.add('show');
            (fields || []).forEach(function (f) { f.classList.add('invalid'); shake(f); });
            buzz([40, 40, 40]);
            setIdle();
        }

        
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = usernameInput.value.trim();
            const password = passInput.value;
            hideError();
            if (!username) { showError('errUser', [userField]); usernameInput.focus(); return; }
            if (!password) { showError('errPass', [passField]); passInput.focus(); return; }
            setLoading();
            document.activeElement && document.activeElement.blur();
            try {
                await new Promise(r => setTimeout(r, 150));
                try {
                  localStorage.setItem('openvex_user', JSON.stringify({username: username, at: Date.now()}));
                  localStorage.setItem('openvex_session', '1');
                } catch (err) {}
                window.location.href = 'openvex-app.html';
            } catch (err) {
                showError('errServer');
                setIdle();
            }
        });


        /* ---------- Init ---------- */
        applyLang(pickInitialLang(), false);
    </script>

<script>
(function(){
  if(window.__ipGt) return; window.__ipGt=true;
  var map={zh:"zh-CN", "zh-cn":"zh-CN", he:"iw", ku:"tr", az:"az"};
  function code(l){l=(l||"en").toLowerCase(); return map[l]||l;}
  function readLang(){
    try{return localStorage.getItem("ip_lang")||localStorage.getItem("openvex_lang")||"en";}catch(e){return "en";}
  }
  function setCombo(lang){
    var c=code(lang);
    var sel=document.querySelector("select.goog-te-combo");
    if(!sel){setTimeout(function(){setCombo(lang);},400);return;}
    if(sel.value===c) return;
    sel.value=c;
    sel.dispatchEvent(new Event("change"));
  }
  window.ipForceTranslate=function(lang){
    try{localStorage.setItem("ip_lang",lang);}catch(e){}
    document.documentElement.lang=lang;
    document.documentElement.dir=/^(fa|ar|ur|he)$/.test(lang)?"rtl":"ltr";
    setCombo(lang);
  };
  window.googleTranslateElementInit=function(){
    try{
      new google.translate.TranslateElement({
        pageLanguage:"auto",
        includedLanguages:"en,fa,ja,tr,de,fr,es,ar,ru,zh-CN,hi,ur,pt,it,ko,id,nl,pl,az,sv,uk,th,vi,ms,bn,ta,iw",
        autoDisplay:false,
        multilanguagePage:true
      },"google_translate_element");
      setTimeout(function(){setCombo(readLang());},800);
    }catch(e){}
  };
  window.addEventListener("message",function(e){
    if(e.data&&e.data.type==="ip-lang"&&e.data.lang) window.ipForceTranslate(e.data.lang);
  });
  if(!document.getElementById("ip-gt-src")){
    var s=document.createElement("script");
    s.id="ip-gt-src";
    s.src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";
    document.head.appendChild(s);
  }
})();
</script>
