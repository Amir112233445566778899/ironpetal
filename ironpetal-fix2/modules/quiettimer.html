<meta charset="UTF-8">

<title>QuietTimer</title>
<style>
:root{--accent:#3d6b4f;--bg:#fbf7f1;--ink:#1a1714;--muted:#6f675f;--line:rgba(26,23,20,.1);--font:system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;padding:20px}
h1{font-size:28px;font-weight:600;margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:18px;font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
button,.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font:inherit}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:6px 0 10px;font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px}
ul{list-style:none} li{padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff;display:flex;justify-content:space-between;gap:8px;align-items:center}
</style></head><body>
<div class="tag">IRONPETAL LAB</div>
<h1 data-i18n="title">QuietTimer</h1>
<p class="sub" data-i18n="sub">Built inside Ironpetal</p>

<div class="card" style="text-align:center">
<p id="disp" style="font-size:48px;font-variant-numeric:tabular-nums">25:00</p>
<div class="row" style="justify-content:center">
<button id="start">Start</button>
<button id="reset" style="background:#fff;color:#1a1714;border:1px solid rgba(26,23,20,.1)">Reset</button>
</div>
<p class="muted" style="margin-top:12px" data-i18n="hint">Focus timer — 25 minutes</p>
</div>
<script>
let left=25*60, t=null;
const d=document.getElementById('disp');
function draw(){const m=String(Math.floor(left/60)).padStart(2,'0');const s=String(left%60).padStart(2,'0');d.textContent=m+':'+s;}
document.getElementById('start').onclick=()=>{if(t)return;t=setInterval(()=>{if(left<=0){clearInterval(t);t=null;return;}left--;draw();},1000);};
document.getElementById('reset').onclick=()=>{clearInterval(t);t=null;left=25*60;draw();};
draw();
</script>

<script>
window.addEventListener('message',function(e){
  if(!e.data||e.data.type!=='ip-lang')return;
  var pack=e.data.pack||{};
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var k=el.getAttribute('data-i18n');
    if(pack[k])el.textContent=pack[k];
  });
  if(e.data.dir)document.documentElement.dir=e.data.dir;
  if(e.data.lang)document.documentElement.lang=e.data.lang;
});
</script>


<!-- FULL-PAGE TRANSLATE (Google element) -->
<style id="gt-hide">
.goog-te-banner-frame,.goog-te-balloon-frame,#goog-gt-tt,.goog-tooltip,.goog-tooltip:hover{display:none!important}
.goog-te-spinner-pos,.goog-logo-link,.goog-te-gadget{display:none!important}
body{top:0!important}
.skiptranslate{display:none!important}
#ipGtBox{position:absolute;width:0;height:0;overflow:hidden;opacity:0;pointer-events:none}
</style>
<div id="ipGtBox"><div id="google_translate_element"></div></div>
<script>
(function(){
  if(window.__ipGt) return; window.__ipGt=true;
  var map={zh:"zh-CN", "zh-cn":"zh-CN", he:"iw", ku:"tr", az:"az"};
  function code(l){l=(l||"en").toLowerCase(); return map[l]||l;}
  function readLang(){
    try{return localStorage.getItem("ip_lang")||localStorage.getItem("openvex_lang")||"en";}catch(e){return "en";}
  }
  function setCombo(lang){
    var c=code(lang);
    var sel=document.querySelector("select.goog-te-combo");
    if(!sel){setTimeout(function(){setCombo(lang);},400);return;}
    if(sel.value===c) return;
    sel.value=c;
    sel.dispatchEvent(new Event("change"));
  }
  window.ipForceTranslate=function(lang){
    try{localStorage.setItem("ip_lang",lang);}catch(e){}
    document.documentElement.lang=lang;
    document.documentElement.dir=/^(fa|ar|ur|he)$/.test(lang)?"rtl":"ltr";
    setCombo(lang);
  };
  window.googleTranslateElementInit=function(){
    try{
      new google.translate.TranslateElement({
        pageLanguage:"auto",
        includedLanguages:"en,fa,ja,tr,de,fr,es,ar,ru,zh-CN,hi,ur,pt,it,ko,id,nl,pl,az,sv,uk,th,vi,ms,bn,ta,iw",
        autoDisplay:false,
        multilanguagePage:true
      },"google_translate_element");
      setTimeout(function(){setCombo(readLang());},800);
    }catch(e){}
  };
  window.addEventListener("message",function(e){
    if(e.data&&e.data.type==="ip-lang"&&e.data.lang) window.ipForceTranslate(e.data.lang);
  });
  if(!document.getElementById("ip-gt-src")){
    var s=document.createElement("script");
    s.id="ip-gt-src";
    s.src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";
    document.head.appendChild(s);
  }
})();
</script>

<div id="ipEmbedBar"><span class="dot"></span><span>Ironpetal</span>
<button type="button" id="ipHomeBtn">Home</button>
<button type="button" id="ipLangBtn">Lang</button>
</div>
<script>
(function(){
  function goHome(){
    try{
      if(window.top && window.top!==window){window.top.postMessage({type:'ip-home'},'*');return;}
    }catch(e){}
    var base=location.pathname.split('/modules/')[0]||'';
    location.href=(base&&base!==location.pathname?base+'/':'../')+'index.html';
  }
  var b=document.getElementById('ipHomeBtn'); if(b) b.onclick=goHome;
  var l=document.getElementById('ipLangBtn');
  if(l) l.onclick=function(){
    try{if(window.top&&window.top!==window){window.top.postMessage({type:'ip-lang-open'},'*');return;}}catch(e){}
  };
  // public auto-login fill
  try{
    var pub=localStorage.getItem('ip_public_login');
    if(pub){
      var d=JSON.parse(pub);
      localStorage.removeItem('ip_public_login');
      setTimeout(function(){
        var users=document.querySelectorAll('input[type=text],input[type=email],input:not([type]),input[name*=user],input[id*=user],input[id*=User],input[placeholder]');
        var passes=document.querySelectorAll('input[type=password]');
        var u=null;
        users.forEach(function(el){
          var id=(el.id||'')+(el.name||'')+(el.placeholder||'');
          if(/user|email|نام|login|id/i.test(id) && !u) u=el;
        });
        if(!u && users[0]) u=users[0];
        if(u){u.value=d.user||'ironpetal'; u.dispatchEvent(new Event('input',{bubbles:true}));}
        if(passes[0]){passes[0].value=d.pass||'ironpetal'; passes[0].dispatchEvent(new Event('input',{bubbles:true}));}
      },600);
    }
  }catch(e){}
})();
</script>


<script>
(function(){
  if(window.__ipGtFast) return; window.__ipGtFast=true;
  var map={zh:'zh-CN',he:'iw'};
  function code(l){l=(l||'en').toLowerCase();return map[l]||l;}
  function lang(){try{return localStorage.getItem('ip_lang')||'en';}catch(e){return 'en';}}
  function applyCookie(l){
    var c=code(l);
    try{document.cookie='googtrans=/auto/'+c+';path=/';document.cookie='googtrans=/auto/'+c+';path=/;domain='+location.hostname;}catch(e){}
  }
  applyCookie(lang());
  window.ipForceTranslate=function(l){
    try{localStorage.setItem('ip_lang',l);}catch(e){}
    applyCookie(l);
    var tries=0;
    (function pulse(){
      var sel=document.querySelector('select.goog-te-combo');
      if(sel){sel.value=code(l);sel.dispatchEvent(new Event('change'));}
      else if(tries++<20) setTimeout(pulse,200);
    })();
  };
  window.googleTranslateElementInit=function(){
    try{
      new google.translate.TranslateElement({pageLanguage:'auto',includedLanguages:'en,fa,ja,tr,de,fr,es,ar,ru,zh-CN,hi,ur,pt,it,ko,id,nl,pl,az,sv,uk,th,vi',autoDisplay:false,multilanguagePage:true},'google_translate_element');
      setTimeout(function(){window.ipForceTranslate(lang());},200);
      setTimeout(function(){window.ipForceTranslate(lang());},800);
    }catch(e){}
  };
  if(!document.getElementById('google_translate_element')){
    var d=document.createElement('div');d.id='google_translate_element';d.style.display='none';document.body?document.body.appendChild(d):document.documentElement.appendChild(d);
  }
  if(!document.getElementById('ip-gt-src')){
    var s=document.createElement('script');s.id='ip-gt-src';
    s.src='https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
    (document.head||document.documentElement).appendChild(s);
  }
  window.addEventListener('message',function(e){if(e.data&&e.data.type==='ip-lang'&&e.data.lang) window.ipForceTranslate(e.data.lang);});
  // restyle hide banner
  var st=document.createElement('style');st.textContent='.goog-te-banner-frame,.skiptranslate,.goog-te-gadget{display:none!important}body{top:0!important}';document.head.appendChild(st);
})();
</script>
