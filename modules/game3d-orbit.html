<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Solar System — Ironpetal</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif;color:#e8eefc}
#ui{position:fixed;inset:0;pointer-events:none;z-index:5}
#hint{position:absolute;top:12px;left:12px;font-size:13px;text-shadow:0 2px 10px #000;line-height:1.5;max-width:280px}
#panel{pointer-events:auto;position:absolute;right:12px;top:12px;width:min(320px,92vw);background:rgba(10,14,24,.82);border:1px solid #ffffff22;border-radius:16px;padding:14px;backdrop-filter:blur(12px);display:none}
#panel h2{margin:0 0 6px;font-size:1.2rem}#panel p{margin:0 0 8px;font-size:12px;color:#b8c4d8;line-height:1.55}
#panel .row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid #ffffff10}
#panel button{margin-top:10px;width:100%;padding:10px;border:0;border-radius:10px;background:#7c6cff;color:#fff;font-weight:600;cursor:pointer}
#list{position:absolute;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:70vw;pointer-events:auto}
#list button{border:1px solid #ffffff25;background:#ffffff12;color:#e8eefc;border-radius:999px;padding:6px 10px;font-size:11px;cursor:pointer}
#list button:hover{background:#7c6cff55}
canvas{display:block}
</style></head><body>
<div id="ui">
  <div id="hint">Drag orbit · Scroll zoom · Click planet for facts<br>WASD / arrows nudge camera · Space pause orbits</div>
  <div id="panel"><h2 id="pt">—</h2><p id="pd"></p><div id="prows"></div><button type="button" id="pclose">Close</button></div>
  <div id="list"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
const DATA=[
{name:'Sun',c:0xffcc55,r:2.4,orbit:0,speed:0,info:{type:'G2V Star',diameter:'1,392,700 km',mass:'1.989e30 kg',temp:'5,772 K',day:'25–35 days',year:'—',moons:'—',fact:'Contains 99.8% of the solar system mass.'}},
{name:'Mercury',c:0xb1b1b1,r:0.28,orbit:4.2,speed:0.020,info:{type:'Terrestrial',diameter:'4,880 km',mass:'3.30e23 kg',temp:'167 °C avg',day:'59 d',year:'88 d',moons:'0',fact:'Fastest planet; extreme day/night temperature swing.'}},
{name:'Venus',c:0xe7c07a,r:0.42,orbit:5.6,speed:0.015,info:{type:'Terrestrial',diameter:'12,104 km',mass:'4.87e24 kg',temp:'464 °C',day:'243 d (retro)',year:'225 d',moons:'0',fact:'Hottest planet due to runaway greenhouse effect.'}},
{name:'Earth',c:0x3d8bfd,r:0.45,orbit:7.2,speed:0.012,info:{type:'Terrestrial',diameter:'12,742 km',mass:'5.97e24 kg',temp:'15 °C avg',day:'24 h',year:'365.25 d',moons:'1',fact:'Only known world with liquid surface water and life.'}},
{name:'Mars',c:0xc1440e,r:0.34,orbit:8.8,speed:0.010,info:{type:'Terrestrial',diameter:'6,779 km',mass:'6.42e23 kg',temp:'-60 °C avg',day:'24.6 h',year:'687 d',moons:'2',fact:'Home to Olympus Mons, the tallest volcano.'}},
{name:'Jupiter',c:0xc9a36a,r:1.15,orbit:12.2,speed:0.006,info:{type:'Gas giant',diameter:'139,820 km',mass:'1.90e27 kg',temp:'-110 °C',day:'10 h',year:'12 y',moons:'95+',fact:'Great Red Spot is a centuries-old storm.'}},
{name:'Saturn',c:0xe6d3a3,r:0.95,orbit:15.2,speed:0.0045,ring:true,info:{type:'Gas giant',diameter:'116,460 km',mass:'5.68e26 kg',temp:'-140 °C',day:'10.7 h',year:'29 y',moons:'140+',fact:'Iconic rings of ice and rock particles.'}},
{name:'Uranus',c:0x7ad1e0,r:0.62,orbit:18.0,speed:0.0032,info:{type:'Ice giant',diameter:'50,724 km',mass:'8.68e25 kg',temp:'-195 °C',day:'17 h',year:'84 y',moons:'28',fact:'Rotates on its side (~98° axial tilt).'}},
{name:'Neptune',c:0x4169e1,r:0.60,orbit:20.6,speed:0.0026,info:{type:'Ice giant',diameter:'49,244 km',mass:'1.02e26 kg',temp:'-200 °C',day:'16 h',year:'165 y',moons:'16',fact:'Strongest winds in the solar system.'}}
];

const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,500);
cam.position.set(0,16,28);
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);
document.body.appendChild(ren.domElement);

// stars
const sp=[];for(let i=0;i<2500;i++)sp.push((Math.random()-0.5)*500,(Math.random()-0.5)*500,(Math.random()-0.5)*500);
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:0.45})));

scene.add(new THREE.AmbientLight(0x223355,0.55));
const sunLight=new THREE.PointLight(0xffeebb,2.8,150);scene.add(sunLight);

const bodies=[];
const raycaster=new THREE.Raycaster();const mouse=new THREE.Vector2();
DATA.forEach((d,i)=>{
  let mat;
  if(d.name==='Sun') mat=new THREE.MeshBasicMaterial({color:d.c});
  else mat=new THREE.MeshStandardMaterial({color:d.c,roughness:0.45,metalness:0.15});
  const mesh=new THREE.Mesh(new THREE.SphereGeometry(d.r,48,48),mat);
  if(d.name==='Sun'){
    const glow=new THREE.Mesh(new THREE.SphereGeometry(d.r*1.25,32,32),new THREE.MeshBasicMaterial({color:0xffaa33,transparent:true,opacity:0.22}));
    mesh.add(glow);
  }
  if(d.ring){
    const rg=new THREE.RingGeometry(d.r*1.4,d.r*2.3,64);
    const rm=new THREE.MeshBasicMaterial({color:0xdcc9a0,side:THREE.DoubleSide,transparent:true,opacity:0.75});
    const ring=new THREE.Mesh(rg,rm);ring.rotation.x=Math.PI/2.3;mesh.add(ring);
  }
  // orbit line
  if(d.orbit>0){
    const pts=[];for(let a=0;a<=64;a++){const t=a/64*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(t)*d.orbit,0,Math.sin(t)*d.orbit))}
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.12})));
  }
  mesh.userData=d;scene.add(mesh);
  bodies.push({mesh,d,a:Math.random()*Math.PI*2});
});

// Earth moon
const moon=new THREE.Mesh(new THREE.SphereGeometry(0.12,16,16),new THREE.MeshStandardMaterial({color:0xcccccc}));
scene.add(moon);

const list=document.getElementById('list');
DATA.forEach((d,i)=>{const b=document.createElement('button');b.textContent=d.name;b.onclick=()=>showInfo(d);list.appendChild(b)});

function showInfo(d){
  document.getElementById('panel').style.display='block';
  document.getElementById('pt').textContent=d.name;
  document.getElementById('pd').textContent=d.info.fact;
  const rows=[['Type',d.info.type],['Diameter',d.info.diameter],['Mass',d.info.mass],['Temp',d.info.temp],['Day',d.info.day],['Year',d.info.year],['Moons',d.info.moons]];
  document.getElementById('prows').innerHTML=rows.map(r=>'<div class="row"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>').join('');
}
document.getElementById('pclose').onclick=()=>document.getElementById('panel').style.display='none';

let mx=0.6,my=0.35,dist=30,down=false,lx=0,ly=0,paused=false;
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){e.preventDefault();paused=!paused}});
addEventListener('keyup',e=>keys[e.code]=false);
ren.domElement.addEventListener('pointerdown',e=>{down=true;lx=e.clientX;ly=e.clientY;ren.domElement.setPointerCapture(e.pointerId)});
ren.domElement.addEventListener('pointerup',()=>down=false);
ren.domElement.addEventListener('pointermove',e=>{if(!down)return;mx+=(e.clientX-lx)*0.005;my=Math.max(-1.2,Math.min(1.2,my+(e.clientY-ly)*0.004));lx=e.clientX;ly=e.clientY});
ren.domElement.addEventListener('wheel',e=>{dist=Math.max(8,Math.min(80,dist+e.deltaY*0.02))},{passive:true});
ren.domElement.addEventListener('click',e=>{
  mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(mouse,cam);
  const hits=raycaster.intersectObjects(bodies.map(b=>b.mesh));
  if(hits[0])showInfo(hits[0].object.userData);
});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});

function loop(){
  requestAnimationFrame(loop);
  if(keys['KeyA']||keys['ArrowLeft'])mx-=0.01;
  if(keys['KeyD']||keys['ArrowRight'])mx+=0.01;
  if(keys['KeyW']||keys['ArrowUp'])my=Math.min(1.2,my+0.01);
  if(keys['KeyS']||keys['ArrowDown'])my=Math.max(-1.2,my-0.01);
  bodies.forEach(b=>{
    if(!paused && b.d.orbit>0)b.a+=b.d.speed;
    if(b.d.orbit>0)b.mesh.position.set(Math.cos(b.a)*b.d.orbit,0,Math.sin(b.a)*b.d.orbit);
    else b.mesh.position.set(0,0,0);
    b.mesh.rotation.y+=0.003;
    if(b.d.name==='Earth'){
      const ma=b.a*10;
      moon.position.set(b.mesh.position.x+Math.cos(ma)*0.9,0.15,b.mesh.position.z+Math.sin(ma)*0.9);
    }
  });
  cam.position.x=Math.sin(mx)*Math.cos(my)*dist;
  cam.position.z=Math.cos(mx)*Math.cos(my)*dist;
  cam.position.y=Math.sin(my)*dist*0.85;
  cam.lookAt(0,0,0);
  ren.render(scene,cam);
}
loop();
})();
</script></body></html>
