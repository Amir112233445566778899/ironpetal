<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timer</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui;background:#0f172a;color:#e2e8f0}#t{font-size:64px;font-weight:700}button{margin:6px;padding:12px 18px;border:0;border-radius:12px;background:#7c6cff;color:#fff;font-weight:600}</style></head>
<body><div style="text-align:center"><div id="t">25:00</div>
<button id="s">Start</button><button id="r">Reset</button></div>
<script>let s=25*60,iv=null;const el=document.getElementById('t');
function draw(){el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
document.getElementById('s').onclick=()=>{if(iv)return;iv=setInterval(()=>{if(s>0)s--;else clearInterval(iv);draw()},1000)};
document.getElementById('r').onclick=()=>{clearInterval(iv);iv=null;s=25*60;draw()};draw()</script></body></html>
