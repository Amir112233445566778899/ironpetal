<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ironpetal 3D Parkour</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui}
#ui{position:fixed;top:10px;left:10px;z-index:2}</style></head><body>
<div id="ui">WASD move · Space jump · collect orbs</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87a0c0);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,200);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);document.body.appendChild(ren.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.8));
const dl=new THREE.DirectionalLight(0xffffff,0.9);dl.position.set(10,20,5);scene.add(dl);
const platforms=[];
function addPlat(x,y,z,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c}));m.position.set(x,y,z);scene.add(m);platforms.push(m);return m}
addPlat(0,0,0,20,1,20,0x3a3a48);
for(let i=1;i<=12;i++) addPlat((i%2?1:-1)*3,i*1.2,-i*4,4,0.6,4,0x5b4b8a);
const player=new THREE.Mesh(new THREE.BoxGeometry(0.8,1.2,0.8),new THREE.MeshStandardMaterial({color:0x7c6cff}));player.position.set(0,1.5,0);scene.add(player);
const orbs=[];for(let i=0;i<10;i++){const o=new THREE.Mesh(new THREE.SphereGeometry(0.25,12,12),new THREE.MeshBasicMaterial({color:0x5eead4}));o.position.set((i%2?2:-2),1.5+i*1.2,-i*4);scene.add(o);orbs.push(o)}
let vel=new THREE.Vector3(),keys={},score=0,onGround=false;
addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
function loop(){
  requestAnimationFrame(loop);
  const sp=0.12;if(keys['KeyA'])player.position.x-=sp;if(keys['KeyD'])player.position.x+=sp;
  if(keys['KeyW'])player.position.z-=sp;if(keys['KeyS'])player.position.z+=sp;
  vel.y-=0.012;player.position.y+=vel.y;onGround=false;
  platforms.forEach(p=>{
    const dx=Math.abs(player.position.x-p.position.x),dz=Math.abs(player.position.z-p.position.z);
    const top=p.position.y+p.geometry.parameters.height/2+0.6;
    if(dx<p.geometry.parameters.width/2 && dz<p.geometry.parameters.depth/2 && player.position.y<=top+0.2 && player.position.y>=top-0.6 && vel.y<=0){player.position.y=top;vel.y=0;onGround=true}
  });
  if(onGround&&keys['Space'])vel.y=0.22;
  orbs.forEach((o,i)=>{if(o.visible&&o.position.distanceTo(player.position)<1){o.visible=false;score++}});
  document.getElementById('ui').textContent='WASD · Space jump · Orbs: '+score;
  cam.position.lerp(new THREE.Vector3(player.position.x,player.position.y+5,player.position.z+8),0.1);
  cam.lookAt(player.position);ren.render(scene,cam);
}
loop();
</script></body></html>
