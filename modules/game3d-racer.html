<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ironpetal 3D Racer</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui}
#ui{position:fixed;top:10px;left:10px;color:#fff;z-index:2;text-shadow:0 1px 4px #000}
#hint{position:fixed;bottom:12px;width:100%;text-align:center;color:#9cf;z-index:2;font-size:13px}
</style>
</head><body>
<div id="ui">Speed: <span id="sp">0</span></div>
<div id="hint">A/D or ←/→ steer · Space boost</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x87ceeb,10,120);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,200);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(devicePixelRatio);document.body.appendChild(ren.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.7));
const sun=new THREE.DirectionalLight(0xfff2cc,1.1);sun.position.set(20,40,10);scene.add(sun);
const roadG=new THREE.BoxGeometry(12,0.2,400);const roadM=new THREE.MeshStandardMaterial({color:0x333340});
const road=new THREE.Mesh(roadG,roadM);road.position.z=-100;scene.add(road);
for(let i=0;i<40;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(1.2,4+Math.random()*8,1.2),new THREE.MeshStandardMaterial({color:0x2d6a4f}));s.position.set((Math.random()<.5?-1:1)*(8+Math.random()*10),2,-i*10);scene.add(s)}
const car=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.6,2.2),new THREE.MeshStandardMaterial({color:0x7c6cff}));car.position.set(0,0.5,0);scene.add(car);
cam.position.set(0,4,8);cam.lookAt(car.position);
let vx=0,speed=0.35,keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
function loop(){
  requestAnimationFrame(loop);
  if(keys['a']||keys['arrowleft'])vx-=0.02;
  if(keys['d']||keys['arrowright'])vx+=0.02;
  if(keys[' ']||keys['space'])speed=Math.min(0.9,speed+0.01); else speed=Math.max(0.35,speed-0.005);
  vx*=0.9;car.position.x=THREE.MathUtils.clamp(car.position.x+vx,-5,5);
  road.position.z+=speed;if(road.position.z>10)road.position.z=-10;
  cam.position.x=car.position.x*0.4;document.getElementById('sp').textContent=(speed*120|0);
  ren.render(scene,cam);
}
loop();
</script></body></html>
