<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>3D Racer</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0a0e18;font-family:system-ui;touch-action:none;color:#e8f0ff}
#hud{position:fixed;top:12px;left:12px;z-index:5;text-shadow:0 2px 8px #000;font-size:14px;line-height:1.5}
#pad{position:fixed;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:6}
#pad button{width:60px;height:60px;border-radius:16px;border:1px solid #fff3;background:#ffffff1a;color:#fff;font-size:18px}
canvas{display:block}
</style></head><body>
<div id="hud">W/↑ accelerate · S/↓ brake · A D steer · Space nitro<br>Speed <b id="sp">0</b> · Distance <b id="dist">0</b>m</div>
<div id="pad">
  <button type="button" data-k="left">◀</button>
  <button type="button" data-k="down">▼</button>
  <button type="button" data-k="nitro">⚡</button>
  <button type="button" data-k="up">▲</button>
  <button type="button" data-k="right">▶</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
const scene=new THREE.Scene();scene.background=new THREE.Color(0x7eb6e8);scene.fog=new THREE.Fog(0x7eb6e8,40,180);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,300);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);
document.body.appendChild(ren.domElement);ren.domElement.tabIndex=0;ren.domElement.focus();
scene.add(new THREE.HemisphereLight(0xffffff,0x556644,1));
const sun=new THREE.DirectionalLight(0xfff2cc,1.1);sun.position.set(20,40,10);scene.add(sun);

// road segments for endless
const roadMats=new THREE.MeshStandardMaterial({color:0x2a2d38,roughness:0.95});
const roads=[];
for(let i=0;i<8;i++){
  const r=new THREE.Mesh(new THREE.BoxGeometry(14,0.3,40),roadMats);
  r.position.set(0,0,-i*40);r.receiveShadow=true;scene.add(r);roads.push(r);
}
// lane lines
const lines=[];
for(let i=0;i<40;i++){
  const l=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.06,2),new THREE.MeshBasicMaterial({color:0xfff3a0}));
  l.position.set(0,0.2,-i*6);scene.add(l);lines.push(l);
}
// side scenery
for(let i=0;i<40;i++){
  const side=i%2?1:-1;
  const b=new THREE.Mesh(new THREE.BoxGeometry(2+Math.random()*2,4+Math.random()*10,2),new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(0.3+Math.random()*0.1,0.4,0.3)}));
  b.position.set(side*(11+Math.random()*8),b.geometry.parameters.height/2,-i*12);scene.add(b);
}

function makeCar(color){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.42,3.1),new THREE.MeshStandardMaterial({color,metalness:0.35,roughness:0.4}));
  body.position.y=0.55;g.add(body);
  const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.38,1.3),new THREE.MeshStandardMaterial({color:0xcde0ff,metalness:0.2,roughness:0.15}));
  cabin.position.set(0,0.9,-0.05);g.add(cabin);
  const wg=new THREE.CylinderGeometry(0.32,0.32,0.22,12);wg.rotateZ(Math.PI/2);
  const wm=new THREE.MeshStandardMaterial({color:0x111111});
  [[-0.8,0.32,1.05],[0.8,0.32,1.05],[-0.8,0.32,-1.05],[0.8,0.32,-1.05]].forEach(p=>{const w=new THREE.Mesh(wg,wm);w.position.set(...p);g.add(w)});
  return g;
}
const player=makeCar(0x6d5efc);scene.add(player);
const traffic=[];
const tColors=[0xef4444,0x22c55e,0xf59e0b,0x06b6d4,0xf472b6,0xeab308];
for(let i=0;i<8;i++){
  const c=makeCar(tColors[i%tColors.length]);
  c.position.set((i%3-1)*3.2,0,-20-i*18);
  c.userData={lane:i%3-1,speed:0.25+Math.random()*0.35,z:c.position.z};
  scene.add(c);traffic.push(c);
}

const hold={left:0,right:0,up:0,down:0,nitro:0};
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();ren.domElement.focus()});
addEventListener('keyup',e=>keys[e.code]=false);
document.querySelectorAll('#pad button').forEach(btn=>{
  const k=btn.getAttribute('data-k');
  const on=e=>{e.preventDefault();hold[k]=1};const off=e=>{e.preventDefault();hold[k]=0};
  ['pointerdown','pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,ev.includes('down')?on:off));
});
ren.domElement.addEventListener('pointerdown',()=>ren.domElement.focus());
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});

let speed=0,x=0,vx=0,world=0;
function loop(){
  requestAnimationFrame(loop);
  const accel=(keys['KeyW']||keys['ArrowUp']||hold.up)?1:0;
  const brake=(keys['KeyS']||keys['ArrowDown']||hold.down)?1:0;
  const nitro=(keys['Space']||hold.nitro)?1:0;
  if(accel) speed+=0.018+nitro*0.02;
  else if(brake) speed-=0.03;
  else speed-=0.008;
  speed=Math.max(0,Math.min(nitro?1.35:0.95,speed));
  if(keys['KeyA']||keys['ArrowLeft']||hold.left)vx-=0.035;
  if(keys['KeyD']||keys['ArrowRight']||hold.right)vx+=0.035;
  vx*=0.86;x=Math.max(-5.2,Math.min(5.2,x+vx));
  player.position.x=x;player.position.y=0;player.rotation.y=-vx*0.7;player.rotation.z=-vx*0.3;
  world+=speed;
  // move road
  roads.forEach((r,i)=>{
    let z=((i*40-world)%(40*8));if(z>40)z-=40*8;
    r.position.z=z-80;
  });
  lines.forEach((l,i)=>{l.position.z=((i*6-world*1.2)%240)-120});
  // traffic
  traffic.forEach((c,i)=>{
    c.userData.z+=c.userData.speed*0.35;
    // relative to player speed
    c.position.z=c.userData.z-world*0.9;
    c.position.x=c.userData.lane*3.2+Math.sin(world*0.02+i)*0.15;
    if(c.position.z>15){c.userData.z=world*0.9-80-Math.random()*40;c.userData.lane=(Math.random()*3|0)-1;c.userData.speed=0.2+Math.random()*0.4}
    // simple collision slow
    if(Math.abs(c.position.z-player.position.z)<2.5 && Math.abs(c.position.x-player.position.x)<1.4) speed*=0.92;
  });
  cam.position.x=x*0.5;cam.position.y=4.8;cam.position.z=player.position.z+9;
  cam.lookAt(x*0.3,0.5,player.position.z-5);
  document.getElementById('sp').textContent=String(Math.round(speed*160));
  document.getElementById('dist').textContent=String(Math.round(world*4));
  ren.render(scene,cam);
}
loop();
window.focus();
})();
</script></body></html>
