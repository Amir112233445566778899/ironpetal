<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>3D Racer</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0a0e18;font-family:system-ui;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;color:#e8f0ff;text-shadow:0 2px 8px #000}
#hud .t{position:absolute;top:12px;left:12px;font-size:14px;line-height:1.5}
#pad{pointer-events:auto;position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:6}
#pad button{width:64px;height:64px;border-radius:18px;border:1px solid #ffffff33;background:#ffffff18;color:#fff;font-size:22px;backdrop-filter:blur(8px)}
#pad button:active{background:#7c6cff88}
canvas{display:block}
</style></head><body>
<div id="hud"><div class="t">Speed <b id="sp">0</b><br>Lap distance <b id="dist">0</b>m</div></div>
<div id="pad">
  <button type="button" id="bl">◀</button>
  <button type="button" id="bb">⚡</button>
  <button type="button" id="br">▶</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87b7e8);
scene.fog=new THREE.Fog(0x87b7e8,30,160);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,300);
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));
ren.shadowMap.enabled=true;document.body.appendChild(ren.domElement);
ren.domElement.tabIndex=0;ren.domElement.focus();

const hemi=new THREE.HemisphereLight(0xddeeff,0x445544,0.95);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1c9,1.15);sun.position.set(30,50,20);sun.castShadow=true;scene.add(sun);

// road
const road=new THREE.Mesh(new THREE.BoxGeometry(14,0.3,500),new THREE.MeshStandardMaterial({color:0x2a2d38,roughness:0.9}));
road.position.z=-120;road.receiveShadow=true;scene.add(road);
const lineMat=new THREE.MeshBasicMaterial({color:0xfff3a0});
for(let i=0;i<60;i++){const l=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.05,2),lineMat);l.position.set(0,0.2,-i*8);scene.add(l)}
// trees/buildings
for(let i=0;i<50;i++){
  const side=i%2?1:-1;
  const b=new THREE.Mesh(new THREE.BoxGeometry(2+Math.random()*2,3+Math.random()*10,2+Math.random()*2),
    new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(0.35+Math.random()*0.1,0.35,0.3+Math.random()*0.2)}));
  b.position.set(side*(10+Math.random()*12),b.geometry.parameters.height/2,-i*9);b.castShadow=true;scene.add(b);
}

// car group
const car=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.45,3.2),new THREE.MeshStandardMaterial({color:0x6d5efc,metalness:0.4,roughness:0.35}));
body.position.y=0.55;body.castShadow=true;car.add(body);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.3,0.4,1.4),new THREE.MeshStandardMaterial({color:0xb9c7ff,metalness:0.2,roughness:0.2}));
cabin.position.set(0,0.95,-0.1);car.add(cabin);
const wheelGeo=new THREE.CylinderGeometry(0.35,0.35,0.25,16);wheelGeo.rotateZ(Math.PI/2);
const wheelMat=new THREE.MeshStandardMaterial({color:0x111111});
[[-0.85,0.35,1.1],[0.85,0.35,1.1],[-0.85,0.35,-1.1],[0.85,0.35,-1.1]].forEach(p=>{
  const w=new THREE.Mesh(wheelGeo,wheelMat);w.position.set(p[0],p[1],p[2]);car.add(w);
});
scene.add(car);
cam.position.set(0,5,9);

const keys={};let left=false,right=false,boost=false;
function down(k){keys[k]=true}
function up(k){keys[k]=false}
addEventListener('keydown',e=>{down(e.key.toLowerCase());if(['arrowleft','arrowright',' ','a','d'].includes(e.key.toLowerCase()))e.preventDefault()});
addEventListener('keyup',e=>up(e.key.toLowerCase()));
// mobile pad
const bindHold=(id,setF)=>{const el=$(id);const on=e=>{e.preventDefault();setF(true)};const off=e=>{e.preventDefault();setF(false)};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointerleave',off);el.addEventListener('pointercancel',off)};
function $(id){return document.getElementById(id)}
bindHold('bl',v=>left=v);bindHold('br',v=>right=v);bindHold('bb',v=>boost=v);
// focus iframe
window.focus();ren.domElement.addEventListener('pointerdown',()=>ren.domElement.focus());

let speed=0.4,x=0,worldZ=0,vx=0;
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
function loop(){
  requestAnimationFrame(loop);
  if(keys['a']||keys['arrowleft']||left)vx-=0.03;
  if(keys['d']||keys['arrowright']||right)vx+=0.03;
  const wantBoost=keys[' ']||keys['space']||boost;
  speed+=(wantBoost?0.012:-0.006);speed=Math.max(0.28,Math.min(1.15,speed));
  vx*=0.88;x=Math.max(-5.5,Math.min(5.5,x+vx));
  car.position.x=x;car.rotation.y=-vx*0.8;car.rotation.z=-vx*0.35;
  worldZ+=speed;road.position.z=(worldZ%8);
  cam.position.x=x*0.45;cam.position.y=4.5;cam.position.z=car.position.z+8;
  cam.lookAt(car.position.x,0.6,car.position.z-4);
  $('sp').textContent=String(Math.round(speed*140));
  $('dist').textContent=String(Math.round(worldZ*3));
  ren.render(scene,cam);
}
loop();
})();
</script></body></html>
