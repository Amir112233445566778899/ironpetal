<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calc</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;font-family:system-ui}.b{width:280px;background:#111827;border-radius:16px;padding:12px;color:#fff}
input{width:100%;font-size:28px;padding:12px;border-radius:10px;border:0;margin-bottom:8px;background:#1f2937;color:#fff}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}button{padding:14px;border:0;border-radius:10px;background:#374151;color:#fff;font-size:16px}</style></head>
<body><div class="b"><input id="d" readonly value="0"><div class="g" id="g"></div></div>
<script>const d=document.getElementById('d');let v='0';
'C 7 8 9 / 4 5 6 * 1 2 3 - 0 . = +'.split(' ').forEach(x=>{const b=document.createElement('button');b.textContent=x;b.onclick=()=>{
 if(x==='C')v='0';else if(x==='='){try{v=String(Function('return '+v)())}catch(e){v='Err'}}else v=(v==='0'&&x>='0'&&x<='9')?x:v+x;d.value=v};
document.getElementById('g').appendChild(b)})</script></body></html>
