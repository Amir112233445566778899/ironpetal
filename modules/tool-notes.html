<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes</title>
<style>body{margin:0;font-family:system-ui;background:#111827;color:#f3f4f6}textarea{width:100%;height:100vh;border:0;padding:16px;background:transparent;color:inherit;font-size:16px;outline:0}</style></head>
<body><textarea id="n" placeholder="Type notes... auto-saved"></textarea>
<script>const n=document.getElementById('n');n.value=localStorage.getItem('ip_notes')||'';n.oninput=()=>localStorage.setItem('ip_notes',n.value)</script></body></html>
